<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Craft Fair Vendor Manager</title>
<style>
/* ============ Craft Fair Vendor Manager — Creative Marketplace ============
   One self-contained file. No external fonts, scripts, images, or requests.
   Palette: warm cream, deep forest green, muted terracotta, soft sage,
   warm charcoal, subtle gold. */
:root{
  --cream:#FBF6EC; --cream2:#F5EDDA; --paper:#FFFDF7;
  --forest:#2D4A33; --forest-dk:#223826; --forest-lt:#4A6B52;
  --terra:#C0765A; --terra-dk:#A85F45; --terra-lt:#E8C9B8;
  --sage:#A8B89A; --sage-lt:#E4EAD9; --sage-mid:#D8E0C8;
  --charcoal:#33302B; --charcoal-lt:#6B655C; --line:#E3D9C2;
  --gold:#C9A227; --gold-lt:#F0E3B2;
  --green:#2E7D4F; --green-bg:#DFF0E4; --red:#B3402E; --red-bg:#FBE3DE;
  --amber:#8A6D1B; --amber-bg:#F7ECC8;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 10px rgba(51,48,43,.10);
  --shadow-lg:0 8px 28px rgba(51,48,43,.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{
  margin:0; background:var(--cream); color:var(--charcoal);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45; padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif; color:var(--forest);}
h1{font-size:1.5rem; margin:0;}
h2{font-size:1.22rem; margin:0 0 .4rem;}
h3{font-size:1.05rem; margin:0 0 .35rem;}
p{margin:.35rem 0;}
small,.hint{color:var(--charcoal-lt); font-size:.82rem;}
a{color:var(--forest);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{
  font-family:inherit; font-size:1rem; color:var(--charcoal);
  background:#FFFDF7; border:1.5px solid var(--line); border-radius:var(--radius-sm);
  padding:.6rem .65rem; width:100%;
  /* Round 5: scroll-margin keeps a focused field clear of the sticky
     header (~110px on a phone) when the browser or the keyboard-settle
     scroll moves it into view — and clear of the fixed bottom nav
     (~59px) at the bottom, so a field scrolled to the foot of the
     visible area never ends up hidden behind the nav. */
  scroll-margin-top:132px; scroll-margin-bottom:76px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage); border-color:var(--forest-lt);}
label{display:block; font-size:.85rem; font-weight:600; color:var(--forest); margin:.55rem 0 .2rem;}
.num{font-variant-numeric:tabular-nums;}
.neg{color:var(--red);}

/* ---------- header ---------- */
header.top{
  background:var(--forest); color:#F5EDDA;
  padding:calc(.8rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) .7rem calc(1rem + env(safe-area-inset-left));
  position:sticky; top:0; z-index:40; box-shadow:0 2px 8px rgba(0,0,0,.18);
}
header.top .wrap{max-width:1060px; margin:0 auto; display:flex; align-items:center; gap:.7rem;}
header.top h1{color:#F5EDDA; font-size:1.25rem; line-height:1.2;}
header.top .sub{font-size:.78rem; color:#CBD8C4; margin-top:.1rem;}
header.top .spacer{flex:1;}
.demo-badge{
  background:var(--gold); color:#3A2E00; font-weight:700; font-size:.68rem;
  letter-spacing:.06em; padding:.28rem .55rem; border-radius:999px; white-space:nowrap;
}
.icon-btn{
  background:rgba(255,255,255,.14); color:#F5EDDA; border:1px solid rgba(255,255,255,.25);
  border-radius:999px; width:40px; height:40px; font-size:1.15rem; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
}

/* ---------- layout ---------- */
main{max-width:1060px; margin:0 auto; padding:1rem 1rem 1.5rem;}
.screen{display:none;}
.screen.active{display:block;}
.screen-head{display:flex; align-items:flex-start; gap:.6rem; margin-bottom:.7rem;}
.screen-head .spacer{flex:1;}
.lede{color:var(--charcoal-lt); font-size:.92rem; margin:.1rem 0 .8rem;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--forest); color:#FBF6EC; border:none; border-radius:999px;
  padding:.62rem 1.15rem; font-size:.95rem; font-weight:600; min-height:44px;
}
.btn:active{transform:translateY(1px);}
.btn.terra{background:var(--terra);}
.btn.gold{background:var(--gold); color:#3A2E00;}
.btn.ghost{background:transparent; color:var(--forest); border:1.5px solid var(--forest);}
.btn.danger{background:transparent; color:var(--red); border:1.5px solid var(--red);}
.btn.small{padding:.4rem .8rem; min-height:36px; font-size:.86rem;}
.btn.block{width:100%;}
.btn:disabled{opacity:.5; cursor:default;}

/* ---------- KPI cards ---------- */
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:.65rem; margin:.4rem 0 1rem;}
.kpi{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:.75rem .85rem; box-shadow:var(--shadow);
}
.kpi .k-label{font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--charcoal-lt);}
.kpi .k-value{font-family:Georgia,serif; font-size:1.55rem; font-weight:700; color:var(--forest); margin-top:.15rem; line-height:1.15;}
.kpi .k-value small{font-size:.95rem;}
.kpi .k-note{font-size:.78rem; color:var(--charcoal-lt); margin-top:.15rem;}
.kpi.hero{background:var(--forest); border-color:var(--forest);}
.kpi.hero .k-label{color:#CBD8C4;}
.kpi.hero .k-value{color:#FBF6EC;}
.kpi.hero .k-note{color:#D8E0C8;}
.kpi.terra{background:var(--terra); border-color:var(--terra);}
.kpi.terra .k-label{color:#FBE3DE;}
.kpi.terra .k-value{color:#FFFDF7;}
.kpi.terra .k-note{color:#F5D9CE;}

/* ---------- cards & sections ---------- */
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:1rem; margin-bottom:1rem;
}
.card h2{margin-top:0;}
.section-title{
  font-family:Georgia,serif; color:var(--forest); font-size:1.1rem; font-weight:700;
  border-bottom:2px solid var(--sage-mid); padding-bottom:.3rem; margin:1.2rem 0 .7rem;
}
.rule{border:none; border-top:1px solid var(--line); margin:1rem 0;}

/* ---------- badges & status ---------- */
.badge{
  display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.04em;
  padding:.22rem .55rem; border-radius:999px; white-space:nowrap;
}
.badge.ok{background:var(--green-bg); color:var(--green);}
.badge.bad{background:var(--red-bg); color:var(--red);}
.badge.warn{background:var(--amber-bg); color:var(--amber);}
.badge.info{background:var(--sage-lt); color:var(--forest);}
.badge.gold{background:var(--gold-lt); color:#6B5510;}
.low-flag{color:var(--red); font-weight:700;}

/* ---------- record lists ---------- */
.rec{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:.85rem .95rem; margin-bottom:.65rem;
}
.rec .r-head{display:flex; align-items:flex-start; gap:.5rem;}
.rec .r-title{font-family:Georgia,serif; font-weight:700; color:var(--forest); font-size:1.05rem;}
.rec .r-sub{font-size:.84rem; color:var(--charcoal-lt);}
.rec .r-actions{margin-left:auto; display:flex; gap:.35rem; flex:0 0 auto;}
.rec .r-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.3rem .9rem; margin-top:.55rem;}
.rec .r-grid.four{grid-template-columns:repeat(4,1fr);}
.rec .r-cell .c-label{font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--charcoal-lt);}
.rec .r-cell .c-value{font-size:.98rem; font-weight:600;}
.mini-btn{
  background:var(--cream2); color:var(--forest); border:1px solid var(--line);
  border-radius:8px; padding:.32rem .6rem; font-size:.82rem; font-weight:600; min-height:34px;
}
.mini-btn.del{color:var(--red);}
.empty{
  text-align:center; color:var(--charcoal-lt); background:var(--paper);
  border:1.5px dashed var(--line); border-radius:var(--radius); padding:1.4rem 1rem; margin:.6rem 0;
}

/* ---------- forms ---------- */
.form-panel{
  background:var(--cream2); border:1.5px solid var(--sage-mid); border-radius:var(--radius);
  padding:1rem; margin-bottom:1rem;
}
.form-panel h3{margin-top:0;}
/* Round 4: a form opening plays a brief entrance — it fades/slides in with
   a terracotta ring that fades away — so the tap that opened it has
   unmistakable feedback. The ring is animation-only; it leaves no trace.
   scroll-margin-top keeps the form clear of the sticky header when it is
   scrolled into view — 128px because the header is ~110px tall on a phone
   (the title wraps to two lines), so 84px left the form's heading hidden
   underneath it. */
.form-panel{scroll-margin-top:128px;}
@keyframes formIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
@keyframes formRing{from{box-shadow:0 0 0 3px var(--terra);} to{box-shadow:0 0 0 0 rgba(0,0,0,0);}}
.form-panel.flash{animation:formIn .35s ease-out, formRing 1.2s ease-out;}
@media (prefers-reduced-motion: reduce){ .form-panel.flash{animation:none;} }
/* Round 6: an event card jumped to from Home lands clear of the sticky
   header (128px, same as the form panels) and plays the same brief
   entrance ring as a form opening. An upcoming event row on Home is a
   tappable link to its event card. */
.rec{scroll-margin-top:128px;}
.rec.flash{animation:formIn .35s ease-out, formRing 1.2s ease-out;}
.rec.clickable{cursor:pointer;}
/* Round 6 (extended): every Home item that navigates shows a pointer —
   KPI cards, event-performance bars and table rows included — so no
   tappable element on Home is a dead tap. */
.kpi[data-action], .bar-row[data-action], table tbody tr[data-action]{cursor:pointer;}
@media (prefers-reduced-motion: reduce){ .rec.flash{animation:none;} }
/* The header Add button while its form is open: it reads "✕ Cancel" and
   looks pressed, so a second tap clearly closes the form instead of
   silently re-opening it. */
.btn.open{background:var(--charcoal); border-color:var(--charcoal); color:#FBF6EC;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:0 .7rem;}
.form-row.three{grid-template-columns:1fr 1fr 1fr;}
.form-actions{display:flex; gap:.5rem; margin-top:.9rem; flex-wrap:wrap;}
.money-input{position:relative;}
.money-input::before{
  content:"$"; position:absolute; left:.65rem; top:50%; transform:translateY(-50%);
  color:var(--charcoal-lt); font-weight:600; pointer-events:none;
}
.money-input input{padding-left:1.5rem;}

/* ---------- tables (desktop) ---------- */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{width:100%; border-collapse:collapse; font-size:.9rem;}
th{
  text-align:left; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--forest); background:var(--sage-lt); padding:.55rem .6rem;
  border-bottom:2px solid var(--sage-mid); white-space:nowrap;
}
td{padding:.55rem .6rem; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.r,th.r{text-align:right;}
tfoot td{font-weight:700; background:var(--cream2);}

/* ---------- charts ---------- */
.chart-box{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:1rem; margin-bottom:1rem;}
.chart-box h3{margin-top:0;}
.chart-box svg{width:100%; height:auto; display:block;}
.legend{display:flex; flex-wrap:wrap; gap:.4rem .9rem; font-size:.83rem; margin-top:.5rem;}
.legend .sw{display:inline-block; width:.75rem; height:.75rem; border-radius:3px; margin-right:.3rem; vertical-align:-1px;}
.bar-row{display:grid; grid-template-columns:8.5rem 1fr 4.2rem; gap:.55rem; align-items:center; margin:.42rem 0; font-size:.88rem;}
.bar-row span:first-child{overflow-wrap:anywhere;}
.bar-track{background:var(--cream2); border-radius:999px; height:.85rem; overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; background:var(--forest);}
.bar-fill.terra{background:var(--terra);}
.bar-fill.gold{background:var(--gold);}
.bar-fill.red{background:var(--red);}

/* ---------- calculator / planner outputs ---------- */
.out-grid{display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.6rem;}
.out{
  background:var(--sage-lt); border-radius:var(--radius-sm); padding:.7rem .8rem;
}
.out .o-label{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--charcoal-lt);}
.out .o-value{font-family:Georgia,serif; font-size:1.35rem; font-weight:700; color:var(--forest); margin-top:.1rem;}
.out .o-note{font-size:.78rem; color:var(--charcoal-lt);}
.out.big{background:var(--forest);}
.out.big .o-label{color:#CBD8C4;}
.out.big .o-value{color:#FBF6EC;}
.out.big .o-note{color:#D8E0C8;}
.verdict{
  border-radius:var(--radius); padding:.9rem 1rem; font-family:Georgia,serif;
  font-size:1.15rem; font-weight:700; text-align:center; margin:.8rem 0;
}
.verdict.go{background:var(--green-bg); color:var(--green); border:2px solid var(--green);}
.verdict.nogo{background:var(--red-bg); color:var(--red); border:2px solid var(--red);}
.verdict.close{background:var(--amber-bg); color:var(--amber); border:2px solid var(--amber);}

/* ---------- bottom nav ---------- */
nav.bottom{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--paper); border-top:1.5px solid var(--line);
  box-shadow:0 -3px 14px rgba(51,48,43,.10);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom .tabs{max-width:1060px; margin:0 auto; display:flex; overflow-x:auto; scrollbar-width:none;}
nav.bottom .tabs::-webkit-scrollbar{display:none;}
nav.bottom button{
  background:none; border:none; padding:.5rem .2rem .45rem; color:var(--charcoal-lt);
  font-size:.72rem; font-weight:600; letter-spacing:.02em; line-height:1.1;
  display:flex; flex-direction:column; align-items:center; gap:.18rem; min-height:58px;
  flex:1 0 auto; min-width:62px;
}
nav.bottom button .ic{font-size:1.25rem; line-height:1;}
nav.bottom button.active{color:var(--forest);}
nav.bottom button.active .ic{color:var(--terra);}

/* ---------- toast & modal ---------- */
#toast{
  position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px);
  background:var(--charcoal); color:#FBF6EC; padding:.65rem 1.1rem; border-radius:999px;
  font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  z-index:90; max-width:92vw; text-align:center; box-shadow:var(--shadow-lg);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#fileInput{display:none;}

/* ---------- help ---------- */
.help-step{display:flex; gap:.7rem; margin:.7rem 0;}
.help-step .n{
  flex:0 0 1.7rem; height:1.7rem; border-radius:50%; background:var(--forest); color:#FBF6EC;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem;
}
.kbd-note{background:var(--cream2); border-left:3px solid var(--gold); padding:.6rem .8rem; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:.9rem;}
.backup-banner{
  background:var(--gold-lt); border:2px solid var(--gold); border-radius:var(--radius);
  padding:.85rem 1rem; margin-bottom:1rem; box-shadow:var(--shadow);
}
.backup-banner p{margin:.1rem 0 .6rem; font-weight:600; color:var(--forest);}
.quick-actions{display:flex; flex-wrap:wrap; gap:.5rem; margin:.2rem 0 .4rem;}
.quick-actions .btn{flex:1 1 auto; min-width:150px;}
.sale-total{margin-top:.7rem;}

/* ---------- narrow phones ---------- */
@media (max-width:759px){
  .rec .r-grid.four{grid-template-columns:repeat(2,1fr);}
  .bar-row{grid-template-columns:5.5rem 1fr 3.8rem; gap:.45rem; font-size:.84rem;}
  /* Record-card actions (e.g. an event card's four buttons) must drop to
     their own line and wrap on a phone: in a single flex row they forced
     the card 60px wider than the screen (390px -> 453px scrollWidth). */
  .rec .r-head{flex-wrap:wrap;}
  .rec .r-head > div:first-child{min-width:0; flex:1 1 100%;}
  .rec .r-actions{margin-left:0; flex-wrap:wrap; flex:1 1 100%; min-width:0;}
}
@media (max-width:480px){
  .form-row,.form-row.three{grid-template-columns:1fr;}
  input,select,textarea{min-height:44px;}
  label{font-size:.9rem;}
  .form-actions .btn{flex:1 1 auto;}
  .out-grid{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(2,1fr);}
}

/* ---------- desktop ---------- */
@media (min-width:760px){
  body{padding-bottom:0;}
  header.top h1{font-size:1.45rem;}
  .kpis{grid-template-columns:repeat(5,1fr);}
  .charts-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  .rec .r-grid{grid-template-columns:repeat(4,1fr);}
  .form-row{grid-template-columns:repeat(3,1fr);}
  nav.bottom{position:static; border-top:none; box-shadow:none; background:transparent; padding:0;}
  nav.bottom .tabs{
    max-width:1060px; margin:0 auto 1rem; display:flex; gap:.4rem; padding:0 1rem;
  }
  nav.bottom button{
    flex:1; flex-direction:row; gap:.45rem; font-size:.92rem; min-height:48px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:.55rem .9rem;
    box-shadow:var(--shadow);
  }
  nav.bottom button.active{background:var(--forest); color:#FBF6EC; border-color:var(--forest);}
  nav.bottom button.active .ic{color:var(--gold-lt);}
  nav.bottom button .ic{font-size:1.05rem;}
  .nav-anchor{position:static; background:var(--cream); padding-top:.6rem;}
  #toast{bottom:30px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Craft Fair Vendor Manager</h1>
      <div class="sub">Your handmade business, in one place</div>
    </div>
    <div class="spacer"></div>
    <span class="demo-badge" id="demoBadge" style="display:none">DEMO DATA</span>
    <button class="icon-btn" id="helpBtn" title="Help &amp; backup" aria-label="Help and backup">?</button>
  </div>
</header>

<div class="nav-anchor">
  <nav class="bottom" aria-label="Sections">
    <div class="tabs" id="navTabs"></div>
  </nav>
</div>

<main>
  <section class="screen" id="screen-dashboard"></section>
  <section class="screen" id="screen-events"></section>
  <section class="screen" id="screen-products"></section>
  <section class="screen" id="screen-sales"></section>
  <section class="screen" id="screen-expenses"></section>
  <section class="screen" id="screen-pricing"></section>
  <section class="screen" id="screen-planner"></section>
  <section class="screen" id="screen-help"></section>
</main>

<div id="toast" role="status"></div>
<input type="file" id="fileInput" accept=".json,application/json">

<script>

/* ==========================================================================

/* ---------------- Demo data (same dataset as the spreadsheet) ---------------- */

/* Numeric coercion helpers for normalizeState(): strings like "12.5"

function coerceNum(v, fallback){

      }
      seen.add(r.id);
      coerce(r);
      out.push(r);
    });

  }
  const events = cleanList(s.events, "e", r=>{
    r.name = coerceStr(r.name);
    r.location = coerceStr(r.location);
    r.date = coerceStr(r.date);
    r.hours = coerceNum(r.hours, 0);
    r.notes = coerceStr(r.notes);
    r.cancelled = (r.cancelled === true);
  });
  const products = cleanList(s.products, "p", r=>{
    r.name = coerceStr(r.name);
    r.category = coerceStr(r.category) || "Other";
    r.sku = coerceStr(r.sku);
    r.materials = coerceNum(r.materials, 0);
    r.labor = coerceNum(r.labor, 0);
    r.packaging = coerceNum(r.packaging, 0);
    r.price = coerceNum(r.price, 0);

    r.payment = coerceStr(r.payment);

  const pricingSrc = (s.pricing && typeof s.pricing === "object" && !Array.isArray(s.pricing)) ? s.pricing : {};
  const plannerSrc = (s.planner && typeof s.planner === "object" && !Array.isArray(s.planner)) ? s.planner : {};
  const pricing = Object.assign(clone(DEMO_DATA.pricing), pricingSrc);
  ["materials","laborHours","laborRate","packaging","overhead","margin","wholesaleDiscount"].forEach(k=>{ pricing[k] = coerceNum(pricing[k], DEMO_DATA.pricing[k]); });

  planner.eventName = coerceStr(planner.eventName);

    state: {

      lowStock: (typeof s.lowStock === "number" && isFinite(s.lowStock)) ? s.lowStock : 5,
      events, products, sales, expenses, pricing, planner,

function loadState(){

      return normalizeState(parsed).state;

       under LS_KEY+".corrupt" BEFORE falling back, so the next save can
       never destroy it. The user is told after init (loadStateCorrupt). */
    try{ localStorage.setItem(LS_KEY + ".corrupt", raw); }catch(e){ /* storage blocked — nothing more we can do */ }
    loadStateCorrupt = true;
  }

}

     itself is unchanged — a failed write is reported, never silently

  calcSaveTimer = setTimeout(()=>{ calcSaveTimer = null; if(!saveState()){ /* error toast already shown by saveState() */ } }, 400);

  if(calcSaveTimer){ clearTimeout(calcSaveTimer); calcSaveTimer = null; }

}

   millisecond timestamp plus a per-page counter (__uidCounter, declared
   above) plus randomness, so ids created in the same millisecond can

function uid(prefix){
  if(window.crypto && typeof window.crypto.randomUUID === "function") return prefix + window.crypto.randomUUID();

/* ---------------- Computed aggregates (E, P2) ----------------
   Single-pass indexes, memoized until the state changes. Before this,

   monthlySeries() filtered sales and expenses per month. Every computed
   reader below now goes through aggregates(), so a render costs one
   pass over the sales and expenses lists, not one pass per product,
   per event, and per month. The values are identical — this is a pure
   refactor: the same sums, grouped in one pass instead of many.

   every write; reloadFromStorage() bumps it when the state object is
   replaced. No render reads computed values without the state having
   been saved or freshly loaded first, so a stale aggregate is

  const unitCostOf = s => {
    if(s && typeof s.unitCost === "number" && isFinite(s.unitCost)) return s.unitCost;

  const salesByEvent = new Map();
  const salesByRef = new Map();

  let expensesTotal = 0;
  let unlinkedSales = false;
  const monthRow = key => {
    let m = monthly.get(key);
    if(!m){ m = { key, revenue:0, expenses:0 }; monthly.set(key, m); }
    return m;
  };
  state.sales.forEach(s=>{
    const net = saleNet(s);
    const cost = (+s.qty||0) * unitCostOf(s);
    salesTotals.gross += saleGross(s);
    salesTotals.discount += (+s.discount||0);
    salesTotals.cost += cost;
    salesTotals.profit += net - cost;
    salesTotals.net += net;
    let roll = salesByProduct.get(s.productId);
    if(!roll){ roll = { qty:0, revenue:0, cost:0 }; salesByProduct.set(s.productId, roll); }
    roll.qty += (+s.qty||0); roll.revenue += net; roll.cost += cost;
    if(s.event){
      let er = salesByEvent.get(s.event);
      if(!er){ er = { revenue:0, cogs:0, qty:0 }; salesByEvent.set(s.event, er); }
      er.revenue += net; er.cogs += cost; er.qty += (+s.qty||0);

      rr.revenue += net;

/* Display name for an event link: an event id resolves to its name; a sales

function eventNameOf(ref){ const ev = ref ? eventById(ref) : null; return ev ? ev.name : (ref || ""); }
/* Convert old name-linked records to id links. Idempotent: ids and channel

   name; a value matching nothing becomes unlinked ("") instead of dropped. */
function migrateEventLinks(){
  /* A Map, not a plain object (L5): an event named "constructor" or
     "toString" must resolve to that event, not to an inherited property. */
  const byName = new Map();
  state.events.forEach(ev=>{ if(!byName.has(ev.name)) byName.set(ev.name, ev.id); });
  let changed = false;
  [state.sales, state.expenses].forEach(list=>{
    list.forEach(r=>{
      if(r.event && !eventById(r.event)){
        if(byName.has(r.event)){ r.event = byName.get(r.event); changed = true; }

/* ISO date compare (L4): dates are YYYY-MM-DD strings, so plain string
   compare orders them correctly — new Date(""), which is NaN, never
   enters a sort. */
function cmpISO(a, b){ a = a||""; b = b||""; return a<b ? -1 : (a>b ? 1 : 0); }
function cmpISODesc(a, b){ return cmpISO(b, a); }
/* Event status (D, item 8): Cancelled beats the date; otherwise the date
   decides — future is Upcoming, today-or-past is Completed. */
function eventStatus(ev){
  if(ev.cancelled) return "Cancelled";
  if(!ev.date) return "No date";
  return ev.date > todayISO() ? "Upcoming" : "Completed";
}
function eventStatusBadge(ev){
  const st = eventStatus(ev);
  if(st === "Cancelled") return '<span class="badge bad">CANCELLED</span>';
  if(st === "Upcoming") return '<span class="badge info">UPCOMING</span>';
  if(st === "Completed") return '<span class="badge ok">COMPLETED</span>';
  return '<span class="badge gold">NO DATE</span>';
}
/* Nearest event to today (M3): the new-sale form defaults to this event
   instead of silently taking the first event in insertion order. */
function nearestEventId(){
  const today = todayISO();
  let best = null, bestDiff = Infinity;
  state.events.forEach(e=>{
    if(e.cancelled || !e.date) return;
    const diff = Math.abs(new Date(e.date + "T12:00:00") - new Date(today + "T12:00:00"));
    if(diff < bestDiff){ bestDiff = diff; best = e.id; }
  });
  return best || "";
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n, dec){
  /* Round to cents FIRST, then test the sign (L1): -0.004 used to render
     "-$0.00" (red) while the badge said Break-even. -0.004 now rounds to
     0 and renders "$0.00". The compact form (no cents at >= $100) is kept
     for card layouts; totals that need cents call money2() instead. */
  n = Math.round((+n || 0) * 100) / 100;
  if(n === 0) n = 0; /* -0 -> 0, so the sign test below never prints "-$0" */
  const d = (dec===undefined) ? (Math.abs(n) >= 100 ? 0 : 2) : dec;
  const abs = Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
  return (n < 0 ? "-$" : "$") + abs;
}
function money2(n){ return money(n, 2); }
function num(v, fallback){ const n = parseFloat(v); return isFinite(n) ? n : (fallback||0); }
function pct(n, dec){ return ((+n||0)*100).toFixed(dec===undefined?1:dec) + "%"; }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}
function monthKey(iso){ return (iso||"").slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", {month:"short", year:"numeric"});
}
function monthShort(key){
  /* Include the year (M14): plain "Jan" repeats across years. "Jan ’26"
     stays short enough for a chart axis and is never ambiguous. */
  const [y,m] = key.split("-").map(Number);
  const mon = new Date(y, m-1, 1).toLocaleDateString("en-US", {month:"short"});
  return mon + " ’" + String(y).slice(2);
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function toast(msg, ms){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), ms||2600);
}
/* Tell the user their stored data could not be read (H5). Shown once,
   after init, and again if a storage reload hits corrupt data. */
function maybeToastCorrupt(){
  if(loadStateCorrupt){
    loadStateCorrupt = false;
    toast("Your saved data could not be read, so the app started with the demo data. The original data was kept as a backup in this browser — import a recent backup file to restore your records.", 9000);
  }
}

/* ---------------- Computed model (single source of truth) ----------------
   Sales Log is the source of sales truth; Expense Tracker is the source of
   expense truth — exactly like the spreadsheet. A booth fee is recorded once,
   on the Expense Tracker, and event totals read it from there. */
function productById(id){ return aggregates().products.get(id) || null; }
function unitCost(p){ return (+p.materials||0) + (+p.labor||0) + (+p.packaging||0); }
function saleGross(s){ return (+s.qty||0) * (+s.price||0); }
function saleNet(s){ return saleGross(s) - (+s.discount||0); }
/* Cost basis of a sale (M2): the unit cost SNAPSHOT stored on the sale
   when it was recorded. A legacy sale with no unitCost falls back to the
   product's current cost; a sale whose product was deleted costs $0.
   Changing a product's costs never rewrites a recorded sale's profit. */
function saleUnitCost(s){
  if(s && typeof s.unitCost === "number" && isFinite(s.unitCost)) return s.unitCost;
  const p = productById(s.productId);
  return p ? unitCost(p) : 0;
}
function saleCost(s){ return (+s.qty||0) * saleUnitCost(s); }
function saleProfit(s){ return saleNet(s) - saleCost(s); }

function productStats(p){
  /* Per-product roll-up from the memoized aggregates (E, P2): the
     quantity sold and revenue are the single-pass sums, not two fresh
     filters over all sales per product. Values identical to before. */
  const cost = unitCost(p);
  const roll = aggregates().salesByProduct.get(p.id);
  const sold = roll ? roll.qty : 0;
  const revenue = roll ? roll.revenue : 0;
  const onHand = (+p.startQty||0) - sold;
  return {
    cost, profitPerUnit: (+p.price||0) - cost,
    margin: (+p.price||0) > 0 ? (((+p.price||0) - cost) / (+p.price||0)) : 0,
    qtySold: sold, onHand, value: Math.max(0, onHand * cost), revenue,
    low: onHand <= (+state.lowStock||0)
  };
}
/* Event contribution (ChatGPT #3, option A; M4): revenue minus product
   costs (COGS — recorded sale quantities x the unit cost snapshot on each
   sale) minus ALL expenses linked to the event, in ANY category — not just
   the four booth/travel/hotel/other form categories. A linked Marketing or
   Materials expense counts here; it is an event expense, NOT COGS, so it
   is never double-counted. Material purchases stay separate business
   expenses: buying materials is not a product cost until the product sells.
   `net` is the contribution (kept as an alias so every caller — dashboard
   table, performance bars, badge — keys on the same number). */
function eventStats(ev){
  /* Per-event roll-up from the memoized aggregates (E, P2): revenue,
     COGS, and quantity from the single-pass sales roll-up; expenses and
     the per-category split from the single-pass expenses roll-up. Values
     identical to before — including the rule that a linked Marketing or
     Materials expense counts in the total but never in COGS. */
  const a = aggregates();
  const sr = a.salesByEvent.get(ev.id) || { revenue:0, cogs:0, qty:0 };
  const er = a.expensesByEvent.get(ev.id) || { total:0, byCat:{} };
  const byCat = {};
  EVENT_COST_CATEGORIES.forEach(c=> byCat[c] = er.byCat[c] || 0);
  const expenses = er.total;
  const sales = sr.revenue;
  const cogs = sr.cogs;
  const qty = sr.qty;
  const contribution = sales - cogs - expenses;
  const hours = +ev.hours||0;
  return { byCat, expenses, sales, cogs, contribution, net: contribution, qty, profitPerHour: hours>0 ? contribution/hours : null };
}
/* Net-profit badge: exactly $0 is BREAK-EVEN, never "profitable".
   A half-cent epsilon absorbs float dust in 2-decimal money sums. */
function profitBadge(net, short){
  if(net > 0.005) return short ? '<span class="badge ok">✓ Profitable</span>' : '<span class="badge ok">✓ PROFITABLE</span>';
  if(net < -0.005) return short ? '<span class="badge bad">✗ Loss</span>' : '<span class="badge bad">✗ LOSS</span>';
  return short ? '<span class="badge info">— Break-even</span>' : '<span class="badge info">— BREAK-EVEN</span>';
}
/* Keep one linked expense record per cost category for an event.
   The Expense Tracker owns the records; this only creates/updates/removes
   them to match what the event form says. Lookup is by event id, so two
   events with the same name never share costs — and renaming an event needs
   no re-linking at all, because the id does not change. */
/* Keep one linked expense record per cost category for an event — but only
   for categories whose value actually changed (M5). Editing an event's
   notes, name, or hours never merges, deletes, or rewrites its expense
   records. When the event DATE changes, the linked records' dates follow
   it, so monthly charts stay honest. A category split across several
   records is never merged silently: the user is asked first, and if they
   say no that category is left exactly as it is (the save still goes
   ahead for everything else). Returns the list of categories that were
   left untouched after a declined merge/clear, so the caller can say so.
   Lookup is by event id, so two events with the same name never share
   costs — and renaming an event needs no re-linking at all, because the
   id does not change. */
function syncEventCosts(eventId, eventDate, costs, prevDate){
  const skipped = [];
  const dateChanged = !!prevDate && prevDate !== eventDate;
  costs.forEach(c=>{
    const linked = state.expenses.filter(x=>x.event===eventId && x.category===c.cat);
    const total = linked.reduce((a,x)=>a+(+x.amount||0),0);
    const amountChanged = Math.abs(total - (+c.amount||0)) > 0.005 || (linked.length===0 && (+c.amount||0) > 0);
    /* Untouched value: leave the records alone — except for the date,
       which follows the event when the event date moved. */
    if(!amountChanged){
      if(dateChanged) linked.forEach(x=>{ x.date = eventDate; });
      return;
    }
    /* The value changed and more than one record holds it: merging (or
       clearing) would destroy per-record dates, descriptions, and payment
       methods. Ask first. */
    if(linked.length > 1){
      const what = (+c.amount||0) > 0
        ? "This event's " + c.cat + " cost is split across " + linked.length + " expense records (total " + money2(total) + "). Saving will combine them into one record of " + money2(+c.amount||0) + ". The total stays the same, but the separate dates, descriptions, and payment methods will be lost."
        : "This event's " + c.cat + " cost is split across " + linked.length + " expense records (total " + money2(total) + "). Clearing it will delete all " + linked.length + " records.";
      if(!window.confirm(what + "\n\nContinue?")){
        skipped.push(c.cat);
        return;
      }
    }
    if((+c.amount||0) > 0){
      if(linked.length){
        linked[0].amount = +c.amount||0;
        linked[0].date = eventDate;
        linked.slice(1).forEach(x=>{ state.expenses = state.expenses.filter(e=>e.id!==x.id); });
      } else {
        state.expenses.push({id:uid("x"), date:eventDate, category:c.cat, description:c.desc, event:eventId, amount:(+c.amount||0), payment:"Card"});
      }
    } else {
      // Cleared (or zero): the linked record(s) for that cost go away.
      linked.forEach(x=>{ state.expenses = state.expenses.filter(e=>e.id!==x.id); });
    }
  });
  return skipped;
}
function totals(){
  /* Totals from the memoized aggregates (E, P2): the sales and expense
     totals, the per-event revenue roll-up, and the current month's row
     are all single-pass sums — totals() no longer re-filters the sales
     list for the month, the event revenue, and each event's stats. */
  const a = aggregates();
  const sales = a.salesTotals.net;
  const expenses = a.expensesTotal;
  /* Upcoming vs attended (ChatGPT #6): a dated event counts as attended
     only once its date has arrived (date <= today). Future events stay in
     the records and in planning; they just do not count as attended. */
  const today = todayISO();
  /* Cancelled events (D, item 8) are excluded from upcoming/attended
     counts and from the average-revenue denominator, but stay listed and
     in total booked. */
  const live = state.events.filter(e=>!e.cancelled);
  const dated = live.filter(e=>e.date);
  const eventsAttended = dated.filter(e=>e.date <= today).length;
  const upcomingEvents = dated.filter(e=>e.date > today).length;
  const totalEvents = state.events.length;
  /* Avg revenue / event (H4 / ChatGPT #5): numerator is event-linked sales
     ONLY — a sale counts only when s.event matches an existing event id.
     Etsy / Online / Wholesale / unlinked sales stay in total business
     revenue above, but never in this numerator. */
  const liveIds = new Set(live.map(e=>e.id));
  let eventRevenue = 0;
  live.forEach(ev=>{ const sr = a.salesByEvent.get(ev.id); if(sr) eventRevenue += sr.revenue; });
  const otherRevenue = sales - eventRevenue;
  /* Other channels: every distinct sales link that is not a live event
     id (a channel name, a cancelled event's id), plus one for unlinked
     sales, if any — exactly the set the old filter-and-map built. */
  let otherChannelCount = a.unlinkedSales ? 1 : 0;
  a.salesByRef.forEach((v, ref)=>{ if(!liveIds.has(ref)) otherChannelCount += 1; });
  /* Best event / best product (M10): require revenue > 0. With no sales
     at all, neither is crowned — the dashboard shows "No sales yet"
     instead of the first record at $0. */
  let bestEvent = null, bestEventNet = -Infinity;
  live.forEach(ev=>{ const st = eventStats(ev); if(st.sales > 0 && st.net > bestEventNet){ bestEventNet = st.net; bestEvent = ev; } });
  let bestProduct = null, bestRevenue = -Infinity;
  state.products.forEach(p=>{ const st = productStats(p); if(st.revenue > 0 && st.revenue > bestRevenue){ bestRevenue = st.revenue; bestProduct = p; } });
  const invValue = state.products.reduce((a,p)=>a+productStats(p).value,0);
  const now = todayISO().slice(0,7);
  const mRow = a.monthly.get(now);
  const mRev = mRow ? mRow.revenue : 0;
  const mExp = mRow ? mRow.expenses : 0;
  return {
    sales, expenses, profit: sales - expenses, eventsAttended,
    upcomingEvents, completedEvents: eventsAttended, totalEvents,
    eventRevenue, otherRevenue,
    avgRevenue: eventsAttended>0 ? eventRevenue/eventsAttended : 0,
    avgOtherRevenue: otherChannelCount>0 ? otherRevenue/otherChannelCount : 0,
    otherChannelCount,
    bestEvent, bestEventNet: bestEvent ? bestEventNet : 0,
    bestProduct, bestProductRevenue: bestProduct ? bestRevenue : 0,
    invValue, monthRevenue: mRev, monthExpenses: mExp, monthProfit: mRev - mExp, monthLabel: monthLabel(now)
  };
}
function monthlySeries(){
  /* Monthly rows from the memoized aggregates (E, P2): one Map lookup
     per month, not a filter over all sales and all expenses per month. */
  const keys = new Set(aggregates().monthly.keys());
  const sorted = [...keys].sort();
  /* Fill the gaps (M14): a month with no sales and no expenses still gets
     a zero row, so the time axis is continuous and the line chart cannot
     jump silently across a missing month. */
  if(sorted.length){
    let cur = sorted[0];
    const last = sorted[sorted.length-1];
    while(cur < last){
      const [y, m] = cur.split("-").map(Number);
      const nm = m === 12 ? 1 : m + 1, ny = m === 12 ? y + 1 : y;
      cur = ny + "-" + String(nm).padStart(2, "0");
      keys.add(cur);
    }
  }
  const filled = [...keys].sort();
  const a = aggregates();
  return filled.map(k=>{
    const m = a.monthly.get(k) || { revenue:0, expenses:0 };
    return { key:k, label:monthLabel(k), short:monthShort(k),
      revenue: m.revenue, expenses: m.expenses, profit: m.revenue - m.expenses };
  });
}
function categoryTotals(){
  const map = {};
  state.products.forEach(p=>{ const st = productStats(p); map[p.category] = (map[p.category]||0) + st.revenue; });
  const total = Object.values(map).reduce((a,v)=>a+v,0);
  return Object.entries(map).map(([cat, revenue])=>({cat, revenue, share: total>0 ? revenue/total : 0}))
    .sort((a,b)=>b.revenue-a.revenue);
}
function expenseByCategory(){
  /* Unknown categories from imports used to be dropped, so the bars did
     not sum to the total (L7). Every category present in the data is now
     kept — known ones first in list order, unknowns after, all sorted by
     total within their group. */
  const map = {};
  EXPENSE_CATEGORIES.forEach(c=> map[c]=0);
  state.expenses.forEach(x=>{ map[x.category] = (map[x.category]||0) + (+x.amount||0); });
  const known = EXPENSE_CATEGORIES.map(c=>({cat:c, total:map[c]}));
  const unknown = Object.keys(map).filter(c=>!EXPENSE_CATEGORIES.includes(c)).map(c=>({cat:c, total:map[c]}));
  return known.concat(unknown).sort((a,b)=>b.total-a.total);
}

/* ---------------- Hand-rolled SVG charts (no libraries) ---------------- */
const CHART_COLORS = ["#2D4A33","#C0765A","#C9A227","#4A6B52","#8A6D3B","#A8B89A","#6B655C","#B3402E"];

/* Left padding for a chart (M14): padL=46 clipped y-axis labels over
   ~$9,999 or negatives. Width is estimated from the longest formatted
   label (about 7.5px per character at 13px) and clamped to a sane range. */
function chartPadL(items, fmt){
  let longest = 0;
  items.forEach(it=>{ longest = Math.max(longest, String(fmt(it.value)).length); });
  return Math.min(110, Math.max(46, Math.ceil(longest * 7.5) + 14));
}
function chartAria(kind, items, fmt){
  return kind + ": " + items.map(it=>it.label + " " + fmt(it.value)).join(", ");
}

function barChartSVG(items, opts){
  // items: [{label, value, color?}] — vertical bars, handles negatives with a zero line.
  const o = Object.assign({height:190, color:"#2D4A33", fmt:v=>money(v)}, opts||{});
  if(!items.length) return '<p class="hint">No data yet — add a record and the chart will appear.</p>';
  const W = 560, H = o.height, padL = chartPadL(items, o.fmt), padB = 26, padT = 12, padR = 8;
  const vals = items.map(i=>i.value);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if(max===min){ max = min + 1; }
  const span = max - min;
  const y = v => padT + (max - v) / span * (H - padT - padB);
  const slot = (W - padL - padR) / items.length;
  const bw = Math.min(44, slot * 0.62);
  /* Chart text is 13px in the 560-wide viewBox (M14): 11px scaled to
     ~6.5px on a phone and was illegible. 13px renders at ~8.3px on a
     360px phone — small but readable — and is full-size on desktop. */
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.ariaLabel || chartAria("Bar chart", items, o.fmt))}">`;
  // gridlines + y labels
  [max, (max+min)/2, min].forEach(gv=>{
    s += `<line x1="${padL}" y1="${y(gv)}" x2="${W-padR}" y2="${y(gv)}" stroke="#E3D9C2" stroke-width="1"/>`;
    s += `<text x="${padL-6}" y="${y(gv)+4}" text-anchor="end" font-size="13" fill="#6B655C">${o.fmt(gv)}</text>`;
  });
  s += `<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="#6B655C" stroke-width="1.2"/>`;
  items.forEach((it, i)=>{
    const cx = padL + slot*i + slot/2;
    const top = y(Math.max(0, it.value)), bot = y(Math.min(0, it.value));
    const col = it.color || (it.value < 0 ? "#B3402E" : o.color);
    s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, bot-top).toFixed(1)}" rx="3" fill="${col}"/>`;
    if(it.value !== 0) s += `<text x="${cx.toFixed(1)}" y="${(it.value>=0 ? top-5 : bot+13).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#33302B">${o.fmt(it.value)}</text>`;
    s += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="13" fill="#6B655C">${esc(it.label)}</text>`;
  });
  return s + "</svg>";
}
function lineChartSVG(items, opts){
  // items: [{label, value}] — line with dots, zero line, negative values below it.
  const o = Object.assign({height:180, color:"#C0765A", fmt:v=>money(v)}, opts||{});
  if(!items.length) return '<p class="hint">No data yet — add a record and the chart will appear.</p>';
  const W = 560, H = o.height, padL = chartPadL(items, o.fmt), padB = 26, padT = 26, padR = 14;
  const vals = items.map(i=>i.value);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if(max===min){ max = min + 1; }
  const span = max - min;
  const x = i => padL + i * (W - padL - padR) / Math.max(1, items.length - 1);
  const y = v => padT + (max - v) / span * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.ariaLabel || chartAria("Line chart", items, o.fmt))}">`;
  // Gridlines only, no y-axis numbers: every point is labeled with its own
  // value, and axis numbers collided with the edge points' labels.
  [max, 0, min].forEach(gv=>{
    s += `<line x1="${padL}" y1="${y(gv)}" x2="${W-padR}" y2="${y(gv)}" stroke="${gv===0 ? '#6B655C' : '#E3D9C2'}" stroke-width="1"/>`;
  });
  const pts = items.map((it,i)=> x(i).toFixed(1)+","+y(it.value).toFixed(1)).join(" ");
  s += `<polyline points="${pts}" fill="none" stroke="${o.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  items.forEach((it,i)=>{
    const px = x(i), py = y(it.value);
    // Label above the point, unless the point is near the top (label goes
    // below instead so it never clips), and clamped sideways so edge
    // points never collide with the y-axis labels.
    const labelY = (py - 10 < padT - 2) ? py + 20 : py - 10;
    const labelX = Math.max(padL + 22, Math.min(W - padR - 22, px));
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="#FFFDF7" stroke="${o.color}" stroke-width="2.5"/>`;
    s += `<text x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#33302B">${o.fmt(it.value)}</text>`;
    s += `<text x="${px.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="13" fill="#6B655C">${esc(it.label)}</text>`;
  });
  return s + "</svg>";
}
function donutSVG(items){
  // items: [{label, value, color}] — doughnut with center total.
  const total = items.reduce((a,i)=>a+i.value,0);
  if(!items.length || total<=0) return '<p class="hint">No sales yet — add a sale and the chart will appear.</p>';
  const cx=110, cy=110, r=88, ir=56, W=220, H=220;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc("Doughnut chart: " + items.map(it=>it.label + " " + money(it.value)).join(", "))}" style="max-width:230px;margin:0 auto;">`;
  let acc = 0;
  items.forEach(it=>{
    const frac = it.value/total;
    const a0 = acc*Math.PI*2 - Math.PI/2, a1 = (acc+frac)*Math.PI*2 - Math.PI/2;
    acc += frac;
    const large = frac > 0.5 ? 1 : 0;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const xi1 = cx + ir*Math.cos(a1), yi1 = cy + ir*Math.sin(a1);
    const xi0 = cx + ir*Math.cos(a0), yi0 = cy + ir*Math.sin(a0);
    if(frac >= 0.999){
      s += `<circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="${it.color}" stroke-width="${r-ir}"/>`;
    } else {
      s += `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${xi1.toFixed(1)} ${yi1.toFixed(1)} A ${ir} ${ir} 0 ${large} 0 ${xi0.toFixed(1)} ${yi0.toFixed(1)} Z" fill="${it.color}"/>`;
    }
  });
  s += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="15" font-weight="700" fill="#2D4A33">Total</text>`;
  s += `<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="14" font-weight="700" fill="#2D4A33">${money(total)}</text>`;
  return s + "</svg>";
}

/* ---------------- Navigation ---------------- */
const SCREENS = [
  {id:"dashboard", label:"Home",     icon:"⌂"},
  {id:"events",    label:"Events",   icon:"✦"},
  {id:"products",  label:"Products", icon:"❋"},
  {id:"sales",     label:"Sales",    icon:"$"},
  {id:"expenses",  label:"Expenses", icon:"◈"},
  {id:"pricing",   label:"Pricing",  icon:"◐"},
  {id:"planner",   label:"Planner",  icon:"✓"}
];
function renderNav(){
  $("navTabs").innerHTML = SCREENS.map(s=>
    `<button data-action="go" data-screen="${s.id}" class="${s.id===currentScreen?'active':''}"${s.id===currentScreen?' aria-current="page"':''}><span class="ic">${s.icon}</span>${s.label}</button>`
  ).join("");
}
function go(screen){
  currentScreen = screen;
  document.querySelectorAll(".screen").forEach(el=>el.classList.remove("active"));
  $("screen-"+screen).classList.add("active");
  renderNav();
  /* Render on navigation (E, P1): a screen marked dirty by renderAll()
     is rebuilt here, when it is actually about to be seen. */
  if(renderScreen(screen)) dirtyScreens.delete(screen);
  window.scrollTo({top:0});
}
/* Screens whose DOM is stale (E, P1). renderAll() used to rebuild all
   eight screens on every save — including the static Help screen — even
   though only the visible one can be seen. Now it rebuilds only the
   active screen and marks the rest dirty; go() renders a dirty screen
   when you navigate to it. */
const dirtyScreens = new Set();
/* Which open form (editing id, or "new") each screen last rendered. Used
   by renderScreen() so a screen with an open form is never re-rendered
   behind the user's back (M7). */
let openFormRendered = {events:null, products:null, sales:null, expenses:null};
/* Form placement (round 4): every add/edit form renders immediately below
   its screen header — never below a tall summary card — so it is in view
   the moment it opens. focusForm() scrolls it into view and plays a brief
   entrance highlight, so a tap has unmistakable feedback even when the
   screen was already at the top. It runs after renderScreen() whether or
   not the M7 guard skipped the re-render, so tapping Add twice still
   shows the form instead of doing nothing visible. */
function focusForm(screen){
  const panel = document.querySelector("#screen-" + screen + " .form-panel");
  if(!panel) return;
  panel.classList.remove("flash");
  void panel.offsetWidth; /* restart the entrance animation */
  panel.classList.add("flash");
  panel.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------------- Home → Events jump (round 6) ----------------
   Tapping an upcoming event on Home opens the Events tab on that
   event's card, scrolled into view with the same brief ring as a form
   opening. If the event is somehow not in the list, the tab still
   opens — the jump never fails the navigation. */
function gotoEvent(id){
  go("events");
  const card = document.getElementById("ev-" + id);
  if(!card) return;
  card.classList.remove("flash");
  void card.offsetWidth; /* restart the entrance animation */
  card.classList.add("flash");
  card.scrollIntoView({behavior:"smooth", block:"start"});
}
/* Round 6 (extended): the same jump, for products and sales — Home's
   inventory warnings and best-selling product land on the product card;
   Home's recent sales land on the sale row. */
function gotoProduct(id){
  go("products");
  const card = document.getElementById("pr-" + id);
  if(!card) return;
  card.classList.remove("flash");
  void card.offsetWidth; /* restart the entrance animation */
  card.classList.add("flash");
  card.scrollIntoView({behavior:"smooth", block:"start"});
}
function gotoSale(id){
  go("sales");
  /* The Sales list shows the newest 50 first; a Home recent sale is
     always inside that window, but if it ever is not, reveal the rest
     and look again before giving up. */
  let row = document.getElementById("sale-" + id);
  if(!row){ App.showMoreSales(); row = document.getElementById("sale-" + id); }
  if(!row) return;
  row.classList.remove("flash");
  void row.offsetWidth; /* restart the entrance animation */
  row.classList.add("flash");
  row.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------------- Keyboard-open scroll (round 5) ----------------
   On a phone the virtual keyboard shrinks the visible area, and the
   field being typed in could end up hidden — under the sticky header
   or below the fold — then jump back once typing started. One helper
   owns ALL field-into-view scrolling, so the browser's native focus
   scroll, focusForm()'s panel scroll, and the keyboard-settle scroll
   never fight: it only scrolls when the field is actually out of
   view, and scrolling to an already-visible field is a no-op. The
   viewport meta carries interactive-widget=resizes-content, so the
   keyboard resizes the layout viewport instead of overlaying it —
   the page reflows and the focused field has somewhere to go.
   Two triggers, one helper: (a) focusin, re-checked ~350ms later
   once the keyboard has finished animating in; (b) visualViewport
   resize (keyboard opening or closing), re-checked ~120ms later.
   Both always test the CURRENTLY focused field, never a stale one. */
let kbSettleTimer = null;
function headerHeight(){
  const h = document.querySelector("header.top");
  return h ? h.getBoundingClientRect().height : 0;
}
function fieldVisible(el){
  if(!el || !el.getBoundingClientRect) return true;
  const vv = window.visualViewport;
  const r = el.getBoundingClientRect();
  /* getBoundingClientRect is relative to the layout viewport; offsetTop
     shifts it into the visual viewport (the area above the keyboard). */
  const top = vv ? r.top - vv.offsetTop : r.top;
  const bottom = vv ? r.bottom - vv.offsetTop : r.bottom;
  const vh = vv ? vv.height : window.innerHeight;
  /* The fixed bottom nav (~59px on a phone, static on desktop) covers
     the foot of the viewport — a field behind it is not visible to the
     user even though it is inside the visual viewport. */
  const nav = document.querySelector("nav.bottom");
  const navH = (nav && getComputedStyle(nav).position === "fixed")
    ? nav.getBoundingClientRect().height : 0;
  /* Fully below the sticky header and fully inside the visual viewport,
     above the bottom nav. */
  return top >= headerHeight() + 4 && bottom <= vh - navH - 4;
}
function keepFieldVisible(el){
  if(!el || fieldVisible(el)) return;
  /* Instant, not smooth: a smooth scroll during the keyboard's own
     animation fights it and looks janky. scroll-margin (CSS) keeps
     the field clear of the sticky header. */
  el.scrollIntoView({behavior:"auto", block:"nearest"});
}
function keepFocusedFieldVisible(){
  const a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")){
    keepFieldVisible(a);
  }
}
document.addEventListener("focusin", function(ev){
  const el = ev.target;
  if(!el || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA" && el.tagName !== "SELECT")) return;
  /* The keyboard animates in over ~300ms after focus; the browser's
     own focus scroll runs first. Re-check after it settles and fix
     up only if the field is still hidden. */
  clearTimeout(kbSettleTimer);
  kbSettleTimer = setTimeout(keepFocusedFieldVisible, 350);
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", function(){
    clearTimeout(kbSettleTimer);
    kbSettleTimer = setTimeout(keepFocusedFieldVisible, 120);
  });
}
function renderScreen(screen){
  /* M7: never re-render a screen whose form is already open and rendered.
     Deleting another record, changing the low-stock threshold, or saving
     on another screen calls renderAll() — and that must not wipe typed
     values. The screen is re-rendered when its form opens, closes, or
     switches to another record; otherwise the existing DOM (and the typed
     values in it) is left exactly as it is. Returns false when the
     screen was skipped, so the caller can keep it marked dirty (E, P1). */
  if(editing[screen] !== undefined && editing[screen] !== null && openFormRendered[screen] === editing[screen]){
    $("demoBadge").style.display = state.demo ? "" : "none";
    return false;
  }
  openFormRendered[screen] = (editing[screen] !== undefined) ? editing[screen] : null;
  if(screen==="dashboard") renderDashboard();
  else if(screen==="events") renderEvents();
  else if(screen==="products") renderProducts();
  else if(screen==="sales") renderSales();
  else if(screen==="expenses") renderExpenses();
  else if(screen==="pricing") renderPricing();
  else if(screen==="planner") renderPlanner();
  else if(screen==="help") renderHelp();
  $("demoBadge").style.display = state.demo ? "" : "none";
  dirtyScreens.delete(screen);
  return true;
}
function renderAll(){
  /* Re-render only the screen in front of the user (E, P1). The other
     screens are marked dirty and rebuilt by go() when navigated to — the
     old version rebuilt all eight screens, including the static Help
     screen, on every save and delete. A screen with an open form is
     still never re-rendered: renderScreen() owns the M7 guard, and a
     screen it skips stays dirty until its form closes. The calculator
     screens are unaffected: typing there updates only their output
     containers, never through here. */
  SCREENS.forEach(s=>{ if(s.id !== currentScreen) dirtyScreens.add(s.id); });
  dirtyScreens.add("help");
  if(renderScreen(currentScreen)) dirtyScreens.delete(currentScreen);
  $("demoBadge").style.display = state.demo ? "" : "none";
}

/* ---------------- Backup reminder (D, queued addition) ----------------
   Browsers cannot download a file from a close handler, and a file:// app
   cannot overwrite files on disk — so the app cannot auto-export on close.
   What it can do is remind: the date/time of each successful export is
   recorded in state.lastExportAt, and on opening the Home screen, if the
   last export is more than 7 days ago (or there has never been one and the
   app holds real records), a banner says so with a one-tap Export button
   and a Dismiss option. Dismissing stays quiet until the next day, and the
   banner never blocks use of the app. Each export is a new dated file —
   old backups stay as history. */
function backupBannerHTML(){
  if(state.reminderDismissedAt === todayISO()) return "";
  const hasRecords = state.events.length + state.products.length + state.sales.length + state.expenses.length > 0;
  let msg = null;
  if(state.lastExportAt){
    const last = new Date(state.lastExportAt);
    if(isNaN(last)) return "";
    const days = Math.floor((Date.now() - last.getTime()) / 86400000);
    if(days <= 7) return "";
    msg = "Your last backup was " + days + " day" + (days===1 ? "" : "s") + " ago — export now?";
  } else if(hasRecords && !state.demo){
    /* Demo data is throwaway (E): the "never exported" reminder only
       fires once the app holds real records, so the banner does not
       appear on first open for the demo business. The >7-days case
       above is unchanged — an old export date is worth reminding about
       either way. */
    msg = "You haven't exported a backup yet — export now?";
  } else {
    return "";
  }
  return `<div class="backup-banner" role="status"><p>${esc(msg)}</p>
    <div class="form-actions" style="margin-top:0">
      <button class="btn" onclick="App.exportJSON()">⬇ Export backup now</button>
      <button class="btn ghost" onclick="App.dismissBackupReminder()">Dismiss</button>
    </div>
    <p class="hint" style="margin:.5rem 0 0">This is a reminder only — the app cannot save a file by itself. Only an export creates a backup file outside this browser.</p></div>`;
}

/* ---------------- Dashboard ---------------- */

  const t = totals();
  const months = monthlySeries();
  const cats = categoryTotals();
  const evRows = state.events.map(ev=>({ev, st:eventStats(ev)}))
    .sort((a,b)=> cmpISO(a.ev.date||"9999", b.ev.date||"9999"));
  const maxEv = Math.max(1, ...evRows.map(r=>Math.abs(r.st.net)));
  /* Charts show at most the last 12 months (M14): more bars than that
     crowd the axis labels together. The month-by-month table below keeps
     every month, including zero months. */
  const chartMonths = months.slice(-12);
  const upcoming = state.events.filter(e=>eventStatus(e)==="Upcoming")
    .sort((a,b)=> cmpISO(a.date||"9999", b.date||"9999"));
  const lowStock = state.products.map(pr=>({pr, st:productStats(pr)}))
    .filter(x=>x.st.onHand < 0 || x.st.low)
    .sort((a,b)=> a.st.onHand - b.st.onHand);
  const recentSales = [...state.sales].sort((a,b)=> cmpISODesc(a.date||"", b.date||"")).slice(0, 5);
  /* Month-by-month footer (L7): sum only the months the rows show. The
     old footer used the all-time totals, which include undated records
     the rows exclude, so the footer never added up. */
  const datedRevenue = months.reduce((a,m)=>a+m.revenue, 0);
  const datedExpenses = months.reduce((a,m)=>a+m.expenses, 0);

  /* Round 6 (extended): every KPI card navigates to its related tab —
     nav is a raw attribute string (data-action + target). A card with
     no related record carries no nav and stays plain. */
  const kpi = (label, value, note, cls, nav) =>
    `<div class="kpi ${cls||''}"${nav ? " " + nav : ""}><div class="k-label">${label}</div><div class="k-value num">${value}</div><div class="k-note">${note}</div></div>`;

  /* Dashboard order (ChatGPT #13): the most actionable info first —
     revenue, profit, upcoming events, inventory warnings, recent sales,
     event performance — then historical charts and reports. Nothing that
     was here before is removed; it is reordered. */
  let h = `
  <div class="screen-head"><div><h2>Your handmade business at a glance</h2>
  <p class="lede">Every number below is calculated live from your events, products, sales, and expenses.</p></div></div>
  ${backupBannerHTML()}
  <div class="kpis">
    ${kpi("Total sales", money(t.sales), "After discounts, all channels", "hero", 'data-action="go" data-screen="sales"')}
    ${kpi("Total profit", money(t.profit), "Sales minus all recorded expenses", t.profit<0?"":"terra", 'data-action="go" data-screen="sales"')}
    ${kpi("Upcoming events", String(t.upcomingEvents), "Booked, date in the future", "", 'data-action="go" data-screen="events"')}
    ${kpi("Events attended", String(t.eventsAttended), "Completed events (date ≤ today)", "", 'data-action="go" data-screen="events"')}
    ${kpi("Total events booked", String(t.totalEvents), "Completed + upcoming + cancelled + undated", "", 'data-action="go" data-screen="events"')}
    ${kpi("Avg revenue / event", money(t.avgRevenue,2), "Event-linked sales ÷ completed events", "", 'data-action="go" data-screen="events"')}
    ${kpi("Avg revenue / other channel", money(t.avgOtherRevenue,2), t.otherChannelCount>0 ? "Non-event sales ÷ " + t.otherChannelCount + " channel" + (t.otherChannelCount===1?"":"s") + " used" : "No non-event sales yet", "", 'data-action="go" data-screen="sales"')}
    ${kpi("Inventory value", money(t.invValue), "At production cost", "", 'data-action="go" data-screen="products"')}
    ${kpi("Monthly revenue", money(t.monthRevenue), "This month — " + esc(t.monthLabel), "", 'data-action="go" data-screen="sales"')}
    ${kpi("Monthly profit", money(t.monthProfit), "This month: revenue − expenses", "", 'data-action="go" data-screen="sales"')}
    ${kpi("Best event", esc(t.bestEvent ? t.bestEvent.name : "—"), t.bestEvent ? "Event contribution " + money(t.bestEventNet) : "No sales yet", "", t.bestEvent ? 'data-action="goto-event" data-id="' + esc(t.bestEvent.id) + '"' : "")}
    ${kpi("Best-selling product", esc(t.bestProduct ? t.bestProduct.name : "—"), t.bestProduct ? "By sales revenue — " + money(t.bestProductRevenue) : "No sales yet", "", t.bestProduct ? 'data-action="goto-product" data-id="' + esc(t.bestProduct.id) + '"' : "")}
    ${kpi("Total expenses", money(t.expenses), "Booth fees, materials, travel &amp; more", "", 'data-action="go" data-screen="expenses"')}
  </div>`;

  h += `<div class="card"><h2>Quick actions</h2>
    <div class="quick-actions">
      <button class="btn" onclick="App.quickAction('sale')">+ Add a sale</button>
      <button class="btn" onclick="App.quickAction('expense')">+ Add an expense</button>
      <button class="btn" onclick="App.quickAction('product')">+ Add a product</button>
      <button class="btn" onclick="App.quickAction('event')">+ Add an event</button>
      <button class="btn ghost" onclick="App.quickAction('lowstock')">Check low-stock products</button>
    </div></div>`;

  h += `<div class="card"><h2>Upcoming events</h2>`;
  if(upcoming.length){
    upcoming.forEach(e=>{
      const st = eventStats(e);
      /* Round 6: the whole row is a link to this event's card on the
         Events tab (data-action="goto-event"). The buttons inside keep
         their own data-action, and the delegated click handler takes the
         nearest one — so "+ Record sale" and "Edit" still do their own
         jobs and only a tap elsewhere on the row navigates. */
      h += `<div class="rec clickable" data-action="goto-event" data-id="${esc(e.id)}" title="Tap to view this event"><div class="r-head"><div><div class="r-title">${esc(e.name)}</div>
        <div class="r-sub">${fmtDate(e.date)} · ${esc(e.location||"")}</div></div>
        <div class="r-actions"><button class="mini-btn" data-action="new-sale-for-event" data-id="${esc(e.id)}">+ Record sale</button>
        <button class="mini-btn" data-action="edit-event" data-id="${esc(e.id)}">Edit</button></div></div>
        <div class="r-grid"><div class="r-cell"><div class="c-label">Event expenses so far</div><div class="c-value num">${money(st.expenses)}</div></div>
        <div class="r-cell"><div class="c-label">Status</div><div class="c-value">${eventStatusBadge(e)}</div></div></div></div>`;
    });
  } else {
    h += `<div class="empty">No upcoming events. Planning your next market? Add an event to track expenses and performance.<br><br><button class="btn terra" onclick="App.quickAction('event')">+ Add an event</button></div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>Inventory warnings</h2>`;
  if(lowStock.length){
    lowStock.forEach(x=>{
      /* Round 6 (extended): a low-stock row jumps to its product card.
         The "+ Add stock" button keeps its own data-action, so only a
         tap elsewhere on the row navigates. */
      h += `<div class="rec clickable" data-action="goto-product" data-id="${esc(x.pr.id)}" title="Tap to view this product"><div class="r-head"><div><div class="r-title">${esc(x.pr.name)}</div>
        <div class="r-sub">${esc(x.pr.category)} · starting qty ${esc(x.pr.startQty)} · ${x.st.qtySold} sold</div></div>
        <div class="r-actions"><button class="mini-btn" data-action="add-stock" data-id="${esc(x.pr.id)}">+ Add stock</button></div></div>
        <div class="r-grid"><div class="r-cell"><div class="c-label">Qty on hand</div><div class="c-value num" style="${x.st.onHand<0?'color:var(--red);':''}">${x.st.onHand}${x.st.onHand<0?' ⚠ oversold':''}</div></div>
        <div class="r-cell"><div class="c-label">Status</div><div class="c-value">${x.st.onHand<0 ? '<span class="badge bad">⚠ OVERSOLD — more sold than made</span>' : '<span class="badge warn">⚠ LOW STOCK</span>'}</div></div></div></div>`;
    });
  } else {
    h += `<div class="empty">Nothing is low on stock right now. Your low-stock threshold is ${esc(state.lowStock)} units (change it on the Products screen).</div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>Recent sales</h2>`;
  if(recentSales.length){
    recentSales.forEach(x=>{
      const pr = productById(x.productId);
      /* Round 6 (extended): a recent-sale row jumps to its row on the
         Sales tab. The "Edit" button keeps its own data-action, so only
         a tap elsewhere on the row navigates. */
      h += `<div class="rec clickable" data-action="goto-sale" data-id="${esc(x.id)}" title="Tap to view this sale"><div class="r-head"><div><div class="r-title">${esc(pr ? pr.name : "(product removed)")}</div>
        <div class="r-sub">${fmtDate(x.date)}${eventNameOf(x.event) ? " · " + esc(eventNameOf(x.event)) : ""} · ${esc(x.payment)}</div></div>
        <div class="r-actions"><button class="mini-btn" data-action="edit-sale" data-id="${esc(x.id)}">Edit</button></div></div>
        <div class="r-grid"><div class="r-cell"><div class="c-label">Qty × price</div><div class="c-value num">${esc(x.qty)} × ${money2(x.price)}</div></div>
        <div class="r-cell"><div class="c-label">Net revenue</div><div class="c-value num">${money2(saleNet(x))}</div></div></div></div>`;
    });
    h += `<p class="hint">Showing the latest ${recentSales.length} sale${recentSales.length===1?"":"s"} — the full list is on the Sales screen.</p>`;
  } else {
    h += `<div class="empty">Record your first sale to start tracking revenue and inventory.<br><br><button class="btn terra" onclick="App.quickAction('sale')">+ Add a sale</button></div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>Event performance</h2>
    <div class="chart-box" style="box-shadow:none;border:none;padding:0;margin-bottom:.6rem">
      ${evRows.length ? evRows.map(r=>`
        <div class="bar-row" data-action="goto-event" data-id="${esc(r.ev.id)}" title="Tap to view this event"><span>${esc(r.ev.name)} ${r.ev.cancelled?'<span class="badge bad">CANCELLED</span>':''}</span>
          <span class="bar-track"><span class="bar-fill ${r.st.net<0?'red':'terra'}" style="display:block;width:${Math.max(2, Math.abs(r.st.net)/maxEv*100).toFixed(1)}%"></span></span>
          <span class="num" style="text-align:right;font-weight:700;${r.st.net<0?'color:var(--red);':''}">${money(r.st.net)}</span></div>`).join("")
        : '<p class="hint">No events yet — add one on the Events screen.</p>'}
      <p class="hint" style="margin-top:.6rem">Event contribution per event: revenue − product costs (COGS) − all linked event expenses.</p>
    </div>`;

  if(evRows.length){
    h += `<div class="table-wrap"><table><thead><tr><th>Event</th><th class="r">Revenue</th><th class="r">Product costs</th><th class="r">Event expenses</th><th class="r">Contribution</th><th class="r">Profit / hour</th><th>Status</th></tr></thead><tbody>`;
    evRows.forEach(r=>{
      const st = r.st;
      h += `<tr data-action="goto-event" data-id="${esc(r.ev.id)}" title="Tap to view this event"><td><strong>${esc(r.ev.name)}</strong><br><small>${fmtDate(r.ev.date)}</small></td>
        <td class="r num">${money2(st.sales)}</td><td class="r num">${money2(st.cogs)}</td><td class="r num">${money2(st.expenses)}</td>

  }
  h += `</div>`;

  h += `<div class="charts-2">
    <div class="chart-box"><h3>Revenue over time</h3>
      ${barChartSVG(chartMonths.map(m=>({label:m.short, value:m.revenue})), {color:"#2D4A33", ariaLabel:"Bar chart of monthly revenue"})}</div>
    <div class="chart-box"><h3>Profit over time</h3>
      ${lineChartSVG(chartMonths.map(m=>({label:m.short, value:m.profit})), {color:"#C0765A", ariaLabel:"Line chart of monthly profit"})}</div>
  </div>`;

  h += `<div class="charts-2">
    <div class="chart-box"><h3>Sales by product category</h3>

    </div>

    </tbody><tfoot><tr><td>All months</td><td class="r num">${money2(datedRevenue)}</td><td class="r num">${money2(datedExpenses)}</td><td class="r num">${money2(datedRevenue - datedExpenses)}</td></tr></tfoot></table></div>
    <hr class="rule">
    <p class="hint"><strong>How profit is counted — revenue, costs, and profit are different numbers:</strong> <strong>Revenue</strong> is what customers paid, minus discounts. <strong>Product costs (COGS)</strong> are what the sold items cost to make — quantity × the unit cost recorded when the sale was made. <strong>Event expenses</strong> are every expense linked to an event (booth, travel, hotel, other, marketing, materials — any category). <strong>Event contribution</strong> is revenue − product costs − event expenses; that is what an event card's badge judges. <strong>Net business profit</strong> (Total profit above) is total sales minus <em>all</em> recorded expenses, including business-wide ones with no event. Buying materials is a business expense, not a product cost — it only becomes a product cost when the item sells, so it is never counted twice. The Net profit on a Sales Log row is the margin on that sale alone, before booth fees and other costs. These views measure different things; do not add them together.</p>
  </div>`;

  $("screen-dashboard").innerHTML = h;
}

/* ---------------- Shared form helpers ---------------- */
function field(label, inner, hint, wide){
  /* Link the label to its field (L11): pull the first id="..." out of the
     inner HTML and put it on the label's for attribute. */
  const m = inner.match(/id="([^"]+)"/);
  const forAttr = m ? ` for="${esc(m[1])}"` : "";
  return `<div${wide?' style="grid-column:1/-1"':''}><label${forAttr}>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function input(id, val, type, attrs){
  return `<input id="${id}" type="${type||"text"}" value="${esc(val===undefined?"":val)}" ${attrs||""}>`;
}
function moneyInput(id, val, extraAttrs){
  return `<span class="money-input">${input(id, val, "number", 'min="0" step="0.01" inputmode="decimal"' + (extraAttrs ? " " + extraAttrs : ""))}</span>`;
}
function selectOpts(options, selected){
  return options.map(o=>`<option value="${esc(o)}" ${o===selected?"selected":""}>${esc(o)}</option>`).join("");
}
/* Event picker. Option values are event ids (names can repeat — same fair,
   different year — and ids keep them separate); sales channels keep their
   own name as the value. When two events share a name the date is shown so
   they can be told apart. */
function eventOptions(selected, includeGeneral, includeChannels){
  /* includeChannels defaults to true (sales channels are real choices on
     the Sales form). The Expense form passes false (L6): a linked event is
     an event, and channels in that dropdown were never read by anything. */
  if(includeChannels === undefined) includeChannels = true;
  const nameCount = {};
  state.events.forEach(e=>{ nameCount[e.name] = (nameCount[e.name]||0) + 1; });
  const label = e => nameCount[e.name] > 1 ? e.name + " · " + fmtDate(e.date) : e.name;
  let opts = "";
  if(includeGeneral){
    opts += `<option value="" ${selected===""?"selected":""}>— General (no event) —</option>`;
  } else if(!selected || (!eventById(selected) && !SALE_CHANNELS.includes(selected))){
    // No event linked (or a link to an event that no longer exists): show
    // an explicit unlinked choice instead of silently picking the first.
    opts += `<option value="" selected>— No event —</option>`;
  }
  /* Round 6: the event pickers list newest first, like the Events tab.
     The SELECTED event is untouched — the sale form still defaults to
     the event nearest today (nearestEventId), never the first option. */
  opts += [...state.events].sort((a,b)=> cmpISODesc(a.date||"", b.date||"")).map(e=>`<option value="${esc(e.id)}" ${e.id===selected?"selected":""}>${esc(label(e))}</option>`).join("");
  if(includeChannels) SALE_CHANNELS.forEach(c=>{ opts += `<option value="${esc(c)}" ${c===selected?"selected":""}>${esc(c)}</option>`; });
  return opts;
}
function confirmDelete(what, fn){
  if(window.confirm("Delete this " + what + "? This cannot be undone.")){ fn(); }
}

/* ---------------- Pricing Calculator ---------------- */
function pricingCalc(){
  const p = state.pricing;
  const laborCost = (+p.laborHours||0) * (+p.laborRate||0);
  const totalCost = (+p.materials||0) + laborCost + (+p.packaging||0) + (+p.overhead||0);
  const margin = +p.margin||0;
  /* A margin of 100% or more has no price (cost ÷ 0); the margin is
     capped at 95% on blur, so this branch only fires on stale data. */
  const price = (margin >= 0 && margin < 1) ? totalCost / (1 - margin) : null;
  const profit = price===null ? null : price - totalCost;
  const actualMargin = (price && price>0) ? profit/price : null;
  const wholesale = price===null ? null : price * (1 - (+p.wholesaleDiscount||0));
  return { laborCost, totalCost, price, profit, actualMargin, wholesale, profit10: profit===null?null:profit*10 };
}
/* The Pricing inputs are rendered ONCE (on navigation / re-render). Typing
   only ever updates #pricing-out below — the input elements are never
   rebuilt while typing, so focus, cursor, and the text being typed survive.
   See pricingChanged()/pricingBlur(). */
function pricingOutHTML(){
  const c = pricingCalc();
  const out = (label, value, note, big) =>
    `<div class="out ${big?'big':''}"><div class="o-label">${label}</div><div class="o-value num">${value}</div>${note?`<div class="o-note">${note}</div>`:""}</div>`;
  return `<div class="out-grid">
      ${out("Labor cost", money2(c.laborCost), "Hours × rate")}
      ${out("Total production cost", money2(c.totalCost), "The four costs added up")}
      ${out("Recommended selling price", c.price===null ? "—" : money2(c.price), c.price===null ? "Margin must be under 100% — at 100% no price leaves any margin." : "", true)}
      ${out("Profit per item", c.profit===null ? "—" : money2(c.profit), "Price − cost")}
      ${out("Profit margin (actual)", c.actualMargin===null ? "—" : pct(c.actualMargin), "Profit ÷ price")}
      ${out("Wholesale price suggestion", c.wholesale===null ? "—" : money2(c.wholesale), "Price × (1 − discount)")}
      ${out("Profit on 10 sold", c.profit10===null ? "—" : money2(c.profit10), "Profit per item × 10")}
    </div>
    <p class="hint" style="margin-top:.7rem"><strong>Margin, not markup:</strong> a 50% margin means half the selling price is profit, so the price is cost ÷ (1 − margin) — cost ÷ 0.50, not cost × 1.50. The margin is capped at 95% — at 100% the price formula cannot work (cost ÷ 0) and the card stays blank, so keep the margin under 100%. Wholesale price is the recommended price minus the discount you give a shop — check it still covers your cost before you agree to it. Costs are your actuals; prices are suggestions, not promises.</p>`;
}
