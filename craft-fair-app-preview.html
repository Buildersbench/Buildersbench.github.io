/* ---------------- Event Profitability Planner ---------------- */
function plannerCalc(){
  const pl = state.planner;
  const fixed = (+pl.booth||0) + (+pl.travel||0) + (+pl.accommodation||0) + (+pl.other||0);
  const expected = +pl.expectedSales||0;
  const revenue = expected * (+pl.avgPrice||0);
  const prodCost = expected * (+pl.avgCost||0);
  const grossProfit = revenue - prodCost;
  const net = grossProfit - fixed;
  const contrib = (+pl.avgPrice||0) - (+pl.avgCost||0);
  const beUnits = contrib > 0 ? fixed / contrib : null;
  const beRevenue = beUnits===null ? null : beUnits * (+pl.avgPrice||0);
  const hours = +pl.hours||0;
  const profitPerHour = hours>0 ? net/hours : null;
  const levels = [0.5, 0.75, 1, 1.25].map(f=>{
    const items = expected * f, rev = items * (+pl.avgPrice||0), n = rev - items*(+pl.avgCost||0) - fixed;
    return {frac:f, items, revenue:rev, net:n};
  });
  return { fixed, revenue, prodCost, grossProfit, net, contrib, beUnits, beRevenue, profitPerHour, levels };
}
/* The Planner inputs are rendered ONCE (on navigation / re-render). Typing
   only ever updates #planner-out below — the input elements are never
   rebuilt while typing, so focus, cursor, and the text being typed survive.
   See plannerChanged()/plannerBlur(). */
function plannerOutHTML(){
  const pl = state.planner;
  const c = plannerCalc();
  /* Verdict threshold (L3): a fixed $100 net meant nothing across event
     sizes — $100 is a triumph on a $150 fair and noise on a $5,000 one.
     Strong GO now means net profit of at least 10% of expected revenue
     (with a $25 floor, so tiny events are not judged on pennies). */
  const strongBar = Math.max(25, 0.10 * c.revenue);
  const verdict = c.net > 0 ? (c.net >= strongBar ? "go" : "close") : "nogo";
  const verdictText = c.net > 0
    ? (c.net >= strongBar ? "✓ GO — this event looks profitable" : "✓ GO — but only just; a slow day could wipe it out")
    : "✗ NO-GO — at these numbers the event would lose money";
  const verdictNote = c.net > 0
    ? "Strong GO means net profit of at least 10% of expected revenue (" + money2(strongBar) + " here) — the bar scales with the event, it is not a fixed $100."
    : "";
  const beNote = c.beUnits===null
    ? "There is no break-even: each item costs as much as (or more than) it sells for, so selling more never covers the fixed costs."
    : `You need to sell ${Math.ceil(c.beUnits)} item${Math.ceil(c.beUnits)===1?"":"s"} to break even — you expect to sell ${pl.expectedSales}.`;
  const out = (label, value, note, big) =>
    `<div class="out ${big?'big':''}"><div class="o-label">${label}</div><div class="o-value num">${value}</div>${note?`<div class="o-note">${note}</div>`:""}</div>`;
  return `<div class="out-grid">
      ${out("Total fixed expenses", money(c.fixed), "Booth + travel + hotel + other")}
      ${out("Expected gross revenue", money(c.revenue))}
      ${out("Expected product cost", money(c.prodCost))}
      ${out("Expected gross profit", money(c.grossProfit), "Revenue − product cost")}
      ${out("Expected net profit", money(c.net), "Gross profit − fixed expenses", true)}
      ${out("Contribution per item", money2(c.contrib), "Price − cost, per item")}
      ${out("Break-even sales (items)", c.beUnits===null ? "—" : c.beUnits.toFixed(2), "Fixed expenses ÷ contribution")}
      ${out("Break-even revenue", c.beRevenue===null ? "—" : money(c.beRevenue))}
      ${out("Expected profit per hour", c.profitPerHour===null ? "—" : money(c.profitPerHour,2), "Net profit ÷ hours")}
    </div>
    <div class="verdict ${verdict}">${verdictText}</div>
    ${verdictNote ? `<p style="text-align:center" class="hint">${esc(verdictNote)}</p>` : ""}
    <p style="text-align:center">${esc(beNote)}</p>
    <hr class="rule">
    <h3>What if sales are higher or lower?</h3>
    <div class="table-wrap"><table><thead><tr><th>Sales level</th><th class="r">Items sold</th><th class="r">Revenue</th><th class="r">Net profit</th><th>Verdict</th></tr></thead><tbody>
    ${c.levels.map(l=>`<tr><td>${Math.round(l.frac*100)}% of expected</td><td class="r num">${Math.round(l.items)}</td><td class="r num">${money(l.revenue)}</td><td class="r num" style="${l.net<0?'color:var(--red);font-weight:700;':''}">${money(l.net)}</td><td>${profitBadge(l.net, true)}</td></tr>`).join("")}
    </tbody></table></div>
    <div style="margin-top:.8rem">${barChartSVG(c.levels.map(l=>({label:Math.round(l.frac*100)+"%", value:l.net, color: l.net>=0 ? "#2D4A33" : "#B3402E"})), {color:"#2D4A33"})}
    <p class="hint" style="text-align:center">Net profit at each sales level</p></div>
    <p class="hint">Break-even is fixed expenses divided by what each item contributes (price minus cost). These are estimates from your own numbers, not a guarantee: a rainy day, a slow fair, or a last-minute fee can move the result.</p>`;
}

/* ---------------- Help screen (built-in guide + troubleshooting) ---------------- */
function renderHelp(){
  $("screen-help").innerHTML = `
  <div class="screen-head"><div><h2>Help &amp; Guide</h2>
  <p class="lede">How this app works, where your data lives, and how to keep it safe.</p></div></div>

  <div class="card"><h2>Welcome</h2>
    <p>This app runs a small craft business: what you sell, where you sell it, what each event really earned, and what your work is worth. It works entirely on your device — there is nothing to install, no account to create, and nothing connects to the internet.</p>
    <p>This copy starts with <strong>demo data</strong> — a made-up ceramics and candle maker, six fairs, March to November 2026 — so you can see how it works with real numbers in it. When you are ready, clear it from the Data &amp; Backup section below and start with your own business.</p>
  </div>

  <div class="card"><h2>How to use each screen</h2>
    <div class="help-step"><span class="n">1</span><div><strong>Home.</strong> Your totals, best event, best-selling product, and charts. Every number is calculated live from the other screens — nothing here is typed in by hand. Everything here is tappable: a total opens its screen, and an upcoming event, low-stock product, recent sale, or event-performance row jumps straight to that record.</div></div>
    <div class="help-step"><span class="n">2</span><div><strong>Events.</strong> Add each fair with its name, place, date, and hours — and its costs, right on the same form: booth fee, travel, hotel, and other. Each event has a status from its date — Upcoming before the date, Completed once it has passed — and events list newest first, so your next fair and your latest ones are at the top and the oldest are at the bottom; nothing is ever hidden. Tapping an upcoming event on the Home screen jumps straight to its card here. A Cancel event button if a fair is called off. A cancelled event stays listed with a CANCELLED badge and keeps its sales and expenses, but no longer counts as upcoming or attended; Restore brings it back. Each cost you enter is saved as a linked record on the Expense Tracker, which stays the single source of truth, so the event totals and the dashboard always agree. Clearing a cost removes its linked record. Items sold come from the Sales Log — tap “+ Record sale” on an event card to add one for that event — so you never type a total twice. Two events can share a name (same fair, different year); each keeps its own costs and sales. Each event card shows Revenue, Product costs (what the sold items cost to make), Event expenses (every expense linked to the event, in any category — not just booth, travel, hotel, and other), Event contribution (revenue minus product costs minus event expenses), Profit / hour, and Items sold. A green ✓ PROFITABLE, amber — BREAK-EVEN, or red ✗ LOSS badge tells you at a glance whether the event made money — the badge judges the event contribution, not revenue alone.</div></div>
    <div class="help-step"><span class="n">3</span><div><strong>Products.</strong> List what you make: materials, labor, and packaging cost, selling price, and how many you started with. Production cost, profit per unit, and margin calculate themselves. When you make more of something, use “+ Add stock” on the product — it raises the starting quantity, so what is left goes up, and your sales history is untouched. Never delete and re-create a product to restock it. Quantity sold and quantity on hand update themselves from the Sales Log. A product is flagged ⚠ LOW STOCK when what is left falls to the threshold you set (5 by default). If a sale is for more than you have on hand, the app warns you before saving — you can still save it, and the product then shows a negative quantity on hand marked ⚠ OVERSOLD, so it is impossible to miss. Inventory value never goes below $0.</div></div>
    <div class="help-step"><span class="n">4</span><div><strong>Sales.</strong> One row per sale: date, event, product, quantity, price, and any discount. A new sale defaults to the event nearest today (or No event) — it never silently takes the first event on the list — and the choice is shown in the Event / channel dropdown. The unit price defaults to the product's selling price and you can change it. The sale total (quantity × price − discount) is shown in the form before you save, and “Save &amp; add another” keeps the event and resets the form for the next transaction after a busy market. The product's cost fills itself in, and the profit on that sale calculates itself. The cost used is the product's production cost at the moment the sale is recorded, and it is kept with that sale — if you later change the product's materials, labor, or packaging cost, old sales keep their original cost and their profit does not change. Older sales recorded before this was added use the product's current cost instead. Recording a sale drops the shelf count on the Products screen and updates the dashboard straight away.</div></div>
    <div class="help-step"><span class="n">5</span><div><strong>Expenses.</strong> Log every cost: date, category, what it was, and the amount. For an event cost (booth fee, travel, hotel), pick the event in Linked event and the Event Tracker picks it up automatically. A booth fee is recorded once, here — never twice.</div></div>
    <div class="help-step"><span class="n">6</span><div><strong>Pricing.</strong> Before you price a new product, put in your real costs and your target margin. It suggests a selling price, shows your profit per item, and gives a wholesale price for shops that stock your work. Costs are your actuals; prices are suggestions, not promises.</div></div>

    <p class="hint"><strong>How profit is counted — revenue, costs, and profit are different numbers:</strong> <strong>Revenue</strong> is what customers paid, minus any discounts. <strong>Product costs (COGS)</strong> are what the sold items cost to make — quantity × the unit cost recorded when the sale was made. <strong>Event expenses</strong> are every expense linked to an event: booth fee, travel, hotel, other, and any other category you link, such as marketing or materials bought for that fair. <strong>Event contribution</strong> is revenue − product costs − event expenses — what the event itself actually earned, and what its badge judges. <strong>Business-wide expenses</strong> are costs with no event attached, such as materials bought in bulk or a business license. <strong>Net business profit</strong> (Total profit on the Home screen) is total sales minus <em>all</em> recorded expenses, event-linked and business-wide alike. Buying materials is a business expense, not a product cost: it only becomes a product cost when the item sells, so it is never counted twice. The Net profit on a Sales Log row is the margin on that sale alone, before booth fees and other costs. Average revenue per event uses event-linked sales only — Etsy, Online Shop, Wholesale, and unlinked sales count in total business revenue but not in that average (a separate average for those other channels is shown next to it). Events attended counts only events whose date has arrived; future bookings are shown separately as Upcoming events. These views measure different things; do not add them together.</p>

    <div class="kbd-note"><strong>The one thing to know:</strong> because your data lives in this browser, it goes away if the browser's data is cleared (for example, clearing browsing data, uninstalling the browser, or a factory reset of the phone). That is why backups matter — see the next section. Your data does <em>not</em> travel with you to another phone or computer by itself; you move it with a backup file, below.</div>
  </div>

  <div class="card"><h2>Data &amp; backup</h2>
    <p>Back up regularly — once a week is a good habit, and always before clearing browser data or switching phones.</p>
    <div class="form-actions" style="margin-top:.2rem">
      <button class="btn" onclick="App.exportJSON()">⬇ Export backup (JSON)</button>
      <button class="btn" onclick="App.importJSON()">⬆ Import backup (JSON)</button>
    </div>
    <p><strong>Export backup (JSON)</strong> downloads one file containing <em>everything</em> — events, products, sales, expenses, and your calculator numbers. Keep that file somewhere safe (your files, cloud drive, or email it to yourself). That file is the only complete copy of your data outside this browser.</p>
    <p><strong>Import backup (JSON)</strong> loads a backup file back into the app. It checks the file first, and it <em>always asks you to confirm</em> before replacing what is currently in the app — importing replaces everything, it does not merge. If you are unsure, export a fresh backup of the current data first, so you can always go back.</p>
    <p><strong>Backup reminder.</strong> The app cannot save a file by itself — browsers will not let a page download anything when it closes, and this app cannot overwrite files on your device. What it does instead is remind you: if your last export was more than 7 days ago (or you have never exported and the app holds real records), a banner on the Home screen says so, with a one-tap Export button and a Dismiss option. Dismissing it stays quiet until the next day, and it never blocks using the app. Only an export creates a backup file outside this browser — the reminder is not a backup.</p>
    <p><strong>CSV exports</strong> (for spreadsheets or your accountant) download just one list at a time:</p>
    <div class="form-actions" style="margin-top:.2rem">
      <button class="btn ghost" onclick="App.exportCSV('sales')">Export Sales Log (CSV)</button>
      <button class="btn ghost" onclick="App.exportCSV('expenses')">Export Expenses (CSV)</button>
    </div>
    <hr class="rule">
    <h3>Moving to another device or phone</h3>
    <p>1. On the old device, tap <strong>Export backup (JSON)</strong> and save the file.<br>
    2. Send that file to the new device — email it to yourself, save it to a cloud drive, or transfer it with a cable.<br>
    3. On the new device, open this app, tap <strong>Import backup (JSON)</strong>, and choose the file.<br>
    4. Check the Home screen totals match what you expect, then keep the backup file somewhere safe.</p>
    <hr class="rule">
    <h3>Demo data</h3>
    <div class="form-actions" style="margin-top:.2rem">
      <button class="btn danger" onclick="App.clearDemo()">Clear demo data / start fresh</button>
      <button class="btn ghost" onclick="App.restoreDemo()">Restore demo data</button>
    </div>
    <p class="hint">“Clear demo data” empties all events, products, sales, and expenses so you can start with your own business. It asks you to confirm first. “Restore demo data” puts the example business back — it replaces whatever is currently in the app, so export a backup first if your own data matters.</p>
  </div>

  <div class="card"><h2>Import &amp; export troubleshooting</h2>
    <p>If something goes wrong with a backup, the cause is almost always the file. Here is what each message means and what to do.</p>
    <h3>“This file is not a Craft Fair Vendor Manager backup”</h3>
    <p>The file you picked is not a backup from this app — it may be a CSV, a photo, or a backup from a different app. Pick the JSON backup file (its name ends in <strong>.json</strong>). If you were trying to open a CSV, use a spreadsheet app instead: CSV files are for reading in a spreadsheet, they cannot be imported back into this app.</p>
    <h3>“This backup is from an older version and cannot be imported”</h3>
    <p>The file was made by an older version of the app and its layout has changed since. If you still have the old device, open the app there, export a fresh backup, and import that one. If the old device is gone, the file cannot be used — check whether you have a newer backup saved anywhere else.</p>
    <h3>“This backup is from a newer version and cannot be imported”</h3>
    <p>The file was made by a newer version of the app than this copy. Open it in the newer copy of the app, or export a fresh backup from there, and import that one.</p>
    <h3>“The backup file is damaged or was edited”</h3>
    <p>The file could not be read as a proper backup — it may have been partly downloaded, edited by hand, or corrupted in transfer. Try downloading or sending it again. If you edited the file yourself, undo the change: even one missing bracket breaks it. Use the most recent backup you have that imports cleanly.</p>
    <h3>“Nothing was imported — the backup has no records”</h3>
    <p>The file is a valid backup, but it contains no events, products, sales, or expenses — it was probably exported from a fresh, empty app. Nothing was changed. Check you picked the right file.</p>
    <h3>“Import failed — browser storage is unavailable”</h3>
    <p>The app could not save after importing, usually because the browser is in private/incognito mode or storage is blocked. Close the private window and open the app in a normal browser window, then try again. Private windows forget everything when closed, so do not keep your business data in one.</p>
    <h3>My data disappeared</h3>
    <p>Data in this app lives in the browser, so it disappears if the browser's data was cleared, the browser was uninstalled, or the phone was reset. <strong>First, do not add new records yet</strong> — import your most recent backup with the Import button above, and check the Home totals. If you have no backup, the data cannot be recovered from the app, because it was never sent anywhere. From now on, export a backup every week and keep the file somewhere safe.</p>
    <h3>How to check a backup file is good before relying on it</h3>
    <p>1. Look at the file name: it should end in <strong>.json</strong> and start with <strong>craft-fair-backup</strong>.<br>
    2. Open the file in any text app: the file is pretty-printed, so it starts with <strong>{</strong> on its own line, then two spaces and <strong>"app": "craft-fair-vendor-manager",</strong> on the next line — if it starts with anything else, it is not a backup from this app.<br>
    3. Once a month, test it: export a fresh backup, then import it back and confirm the Home totals are unchanged. A backup you have never tested is only a hope.<br>
    4. Keep at least two backups in two places (for example, one on the phone and one in cloud storage or email).</p>
    <h3>Export didn't download anything</h3>
    <p>Check the browser's download settings — some browsers ask where to save the file, and some block multiple downloads. Allow downloads for this page, then tap Export again. The file is created entirely on your device; no internet is needed.</p>
  </div>

  </div>`;

/* ---------------- CRUD actions ---------------- */
function readNum(id){ return num($(id) ? $(id).value : "", 0); }
function readStr(id){ return $(id) ? $(id).value.trim() : ""; }
/* Save, re-render, and report success — but ONLY if the save actually
   landed (H2). On a failed save, saveState() has already shown the error
   toast; reporting "saved" on top of it would be a lie. */
function afterChange(msg){ const ok = saveState(); renderAll(); if(ok && msg) toast(msg); }

/* Calculator input helpers (Pricing / Planner). Input handlers read the RAW
   field text into state — no clamping, rounding, trimming, or write-back —
   so typing is never disturbed. Blur/change handlers clamp via
   clampCalcState() and write back only where the text no longer matches. */
function readPricingInputs(){
  state.pricing = {
    materials: readNum("f-pr-mat"), laborHours: readNum("f-pr-hours"), laborRate: readNum("f-pr-rate"),
    packaging: readNum("f-pr-pack"), overhead: readNum("f-pr-oh"),
    margin: readNum("f-pr-margin")/100,
    wholesaleDiscount: readNum("f-pr-ws")/100
  };
}
function readPlannerInputs(){
  state.planner = {
    eventName: $("f-pl-name") ? $("f-pl-name").value : "",
    booth: readNum("f-pl-booth"), travel: readNum("f-pl-travel"),
    accommodation: readNum("f-pl-accom"), other: readNum("f-pl-other"),
    expectedSales: readNum("f-pl-exp"),
    avgPrice: readNum("f-pl-price"), avgCost: readNum("f-pl-cost"), hours: readNum("f-pl-hours")
  };
}
/* Clamp the calculator state in place. Only called on blur/change, on a
   debounced-save flush, or on pagehide — never while typing. */
function clampCalcState(){
  const p = state.pricing;
  ["materials","laborHours","laborRate","packaging","overhead"].forEach(k=>{ p[k] = Math.max(0, +p[k]||0); });
  p.margin = Math.min(0.95, Math.max(0, +p.margin||0));
  p.wholesaleDiscount = Math.min(0.9, Math.max(0, +p.wholesaleDiscount||0));
  const pl = state.planner;
  pl.eventName = String(pl.eventName==null?"":pl.eventName).trim();
  ["booth","travel","accommodation","other","avgPrice","avgCost","hours"].forEach(k=>{ pl[k] = Math.max(0, +pl[k]||0); });
  pl.expectedSales = Math.max(0, Math.round(+pl.expectedSales||0));
}
/* Write a clamped value back into an input only if the displayed text no
   longer matches it. Empty fields are left empty — clearing a field never
   snaps it to "0". */
function syncNumInput(id, value){
  const el = $(id); if(!el || el.value === "") return;
  if(parseFloat(el.value) !== value) el.value = String(value);
}

const App = {
  go,
  gotoEvent,
  gotoProduct,
  gotoSale,

  /* -- forms -- */
  cancelForm(screen){ if(screen==="sales") salePreselectEvent = null; editing[screen] = null; renderScreen(screen); },

  /* Round 6 (extended): a form opener must work from ANY screen — the
     Edit buttons on Home call these while the dashboard is showing, and
     without go() the form opened on a hidden screen (a dead tap). go()
     first is harmless when already on that screen (quickAction does
     the same). */
  newEvent(){ go("events"); editing.events = "new"; renderScreen("events"); focusForm("events"); },
  editEvent(id){ go("events"); editing.events = id; renderScreen("events"); focusForm("events"); },
  saveEvent(){
    const name = readStr("f-ev-name");
    if(!name){ toast("Give the event a name first."); return; }
    const rec = { name, location: readStr("f-ev-loc"), date: $("f-ev-date").value || todayISO(),
      hours: readNum("f-ev-hours"), notes: readStr("f-ev-notes") };
    // Event costs entered here are saved as linked Expense Tracker records
    // (one per cost category) — the Expense Tracker stays the single source
    // of truth; the event card and dashboard read the same roll-up.
    const costs = [
      {cat:"Booth fees",    amount: readNum("f-ev-booth"),  desc:"Booth fee"},
      {cat:"Travel",        amount: readNum("f-ev-travel"), desc:"Mileage & parking"},
      {cat:"Accommodation", amount: readNum("f-ev-hotel"),  desc:"Hotel"},
      {cat:"Other",         amount: readNum("f-ev-other"),  desc:"Other event cost"}
    ];
    const isEdit = editing.events && editing.events !== "new";
    let eventId, prevDate = null;
    if(isEdit){
      eventId = editing.events;
      const existing = state.events.find(e=>e.id===eventId);
      prevDate = existing ? existing.date : null;
      Object.assign(existing, rec);
    } else {
      eventId = uid("e");
      state.events.push(Object.assign({id:eventId}, rec));
    }
    // Costs link by the event's id, so renaming needs no re-linking: the
    // sales and expenses already point at this id.
    const skipped = syncEventCosts(eventId, rec.date, costs, prevDate);
    editing.events = null;
    afterChange(skipped.length
      ? "Event saved. Note: " + skipped.join(", ") + " was left split across several expense records — combine them on the Expense Tracker if you want one record."
      : "Event saved.");
  },
  deleteEvent(id){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    /* L8: the confirm says what happens to the money — sales and expenses
       are kept and unlinked, so the totals are unchanged. */
    if(!window.confirm("Delete the event \"" + ev.name + "\"?\n\nIts sales and expenses are kept and unlinked — they stay in your totals as unlinked records, and the other events are untouched. This cannot be undone.")) return;
    {
      state.events = state.events.filter(e=>e.id!==id);
      // The event goes, but its money stays: its sales and expenses are
      // kept and unlinked, so the totals are unchanged and the other
      // events are untouched.
      state.sales.forEach(s=>{ if(s.event===id) s.event = ""; });
      state.expenses.forEach(x=>{ if(x.event===id) x.event = ""; });
      afterChange("Event deleted.");
    }
  },
  /* Cancel / restore an event (item 8). Cancelling is reversible: the
     event stays listed with a CANCELLED badge, its sales and expenses are
     kept, but it no longer counts as upcoming or attended and drops out
     of the average-revenue denominator. */
  cancelEvent(id){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    ev.cancelled = true;
    afterChange("Event cancelled — it stays listed, but no longer counts as upcoming or attended. Use Restore to bring it back.");
  },
  uncancelEvent(id){
    const ev = state.events.find(e=>e.id===id);
    if(!ev) return;
    ev.cancelled = false;
    afterChange("Event restored.");
  },

  newProduct(){ go("products"); editing.products = "new"; renderScreen("products"); focusForm("products"); },
  editProduct(id){ go("products"); editing.products = id; renderScreen("products"); focusForm("products"); },
  saveProduct(){
    const name = readStr("f-p-name");
    if(!name){ toast("Give the product a name first."); return; }
    const rec = { name, category: $("f-p-cat").value, sku: readStr("f-p-sku"),
      materials: readNum("f-p-mat"), labor: readNum("f-p-lab"), packaging: readNum("f-p-pack"),
      price: readNum("f-p-price"), startQty: Math.max(0, Math.round(readNum("f-p-qty"))) };
    /* L9: costs and prices cannot be negative (startQty is clamped above). */
    if(rec.materials < 0 || rec.labor < 0 || rec.packaging < 0 || rec.price < 0){
      toast("Costs and the selling price cannot be negative — check the numbers.");
      return;
    }
    if(editing.products && editing.products !== "new"){
      Object.assign(state.products.find(p=>p.id===editing.products), rec);
    } else {
      state.products.push(Object.assign({id:uid("p")}, rec));
    }
    editing.products = null; afterChange("Product saved.");
  },
  deleteProduct(id){
    const used = state.sales.some(s=>s.productId===id);
    if(used){ toast("That product has sales recorded. Delete those sales first, or keep the product."); return; }
    confirmDelete("product", ()=>{
      state.products = state.products.filter(p=>p.id!==id);
      afterChange("Product deleted.");
    });
  },
  /* Add newly produced inventory (item 7): increases the product's
     starting quantity, so on-hand goes up by exactly that much. Sales
     history is untouched — nothing is deleted or re-created. */
  addStock(id){
    const prod = state.products.find(p=>p.id===id);
    if(!prod) return;
    const st = productStats(prod);
    const answer = window.prompt("Add stock — “" + prod.name + "”\n\nOn hand now: " + st.onHand + " (started with " + prod.startQty + ", sold " + st.qtySold + ").\n\nHow many more did you make?", "10");
    if(answer === null) return;
    const n = Math.floor(Number(answer));
    if(!isFinite(n) || n <= 0){ toast("Enter a whole number greater than zero."); return; }
    prod.startQty = (+prod.startQty||0) + n;
    const ok = saveState(); renderAll();
    if(ok) toast("Added " + n + " to “" + prod.name + "” — on hand is now " + productStats(prod).onHand + ". Sales history was not touched.");
  },
  /* Dashboard Quick Actions (item 17): every button opens the real form. */
  quickAction(kind){
    if(kind === "sale"){ go("sales"); App.newSale(); }
    else if(kind === "expense"){ go("expenses"); App.newExpense(); }
    else if(kind === "product"){ go("products"); App.newProduct(); }
    else if(kind === "event"){ go("events"); App.newEvent(); }
    else if(kind === "lowstock"){ go("products"); }
  },
  /* Backup reminder: dismissed today, quiet until tomorrow. */
  dismissBackupReminder(){
    state.reminderDismissedAt = todayISO();
    const ok = saveState();
    if(ok && currentScreen === "dashboard") renderScreen("dashboard");
  },
  setLowStock(v){
    const n = Math.max(0, Math.round(num(v, 5)));
    state.lowStock = n; const ok = saveState(); renderScreen("products");
    if(ok) toast("Low-stock threshold set to " + n + ".");
  },

  newSale(){ go("sales"); salePreselectEvent = null; editing.sales = "new"; renderScreen("sales"); focusForm("sales"); },
  editSale(id){ go("sales"); editing.sales = id; renderScreen("sales"); focusForm("sales"); },
  /* Open the Sales form from an event card, with that event pre-selected.
     The sale is still entered on the Sales Log — this is only a shortcut. */
  newSaleForEvent(eventId){
    if(!eventById(eventId)) return;
    salePreselectEvent = eventId;
    editing.sales = "new";
    go("sales");
    focusForm("sales");
  },
  saleProductChanged(){
    const p = productById($("f-s-product").value);
    if(p && $("f-s-price")) $("f-s-price").value = p.price;
    App.salePreview();
  },
  /* Live sale total (item 9): quantity × unit price − discount, shown in
     the form before saving and updated as you type. */
  salePreview(){
    const el = $("sale-total-value");
    if(!el) return;
    const qty = Math.max(0, Math.round(readNum("f-s-qty")||0));
    const price = readNum("f-s-price");
    const disc = Math.max(0, readNum("f-s-disc"));
    el.textContent = money2(qty * price - disc);
  },
  saveSale(addAnother){
    const productId = $("f-s-product").value;
    if(!productId){ toast("Add a product first, then record the sale."); return; }
    const qty = Math.max(1, Math.round(readNum("f-s-qty")||1));
    const price = readNum("f-s-price");
    const discount = Math.max(0, readNum("f-s-disc"));
    /* L9: a $0 unit price is not a sale — it is a typo (or a giveaway
       entered in the wrong place). */
    if(price <= 0){ toast("Enter a unit price greater than zero."); return; }
    if(discount > qty * price){ toast("The discount is bigger than the sale — check the numbers."); return; }
    const prod = productById(productId);
    /* Negative inventory (M9): warn, do not block. On-hand here counts the
       sale being edited as still sold, so editing it back up to its old
       quantity never warns. If the vendor proceeds, on-hand goes negative
       and is shown clearly on the Products screen; Inventory value is
       clamped at $0 so overselling can never reduce it. */
    if(prod){
      const editingRec = (editing.sales && editing.sales !== "new") ? state.sales.find(s=>s.id===editing.sales) : null;
      const onHandNow = productStats(prod).onHand + ((editingRec && editingRec.productId===productId) ? (+editingRec.qty||0) : 0);
      if(qty > onHandNow){
        const left = onHandNow - qty;
        if(!window.confirm("Only " + onHandNow + " of “" + prod.name + "” " + (onHandNow===1?"is":"are") + " on hand, but this sale is for " + qty + ".\n\nSaving will leave stock at " + left + " (oversold). The sale will still be recorded.\n\nSave it anyway?")) return;
      }
    }
    /* Cost snapshot (M2): the product's production cost right now is
       stored on the sale, so this sale's profit never changes if the
       product's costs change later. */
    const rec = { date: $("f-s-date").value || todayISO(), event: $("f-s-event").value,
      productId, qty, price, discount, payment: $("f-s-pay").value,
      unitCost: prod ? unitCost(prod) : 0 };
    if(editing.sales && editing.sales !== "new"){
      Object.assign(state.sales.find(s=>s.id===editing.sales), rec);
    } else {
      state.sales.push(Object.assign({id:uid("s")}, rec));
    }
    /* Save & add another (item 9): keep the event, reset the rest of the
       form, and stay on the Sales screen ready for the next transaction. */
    if(addAnother){
      const keptEvent = rec.event;
      editing.sales = null; salePreselectEvent = keptEvent;
      const ok = saveState();
      editing.sales = "new";
      /* Force the re-render: the M7 guard would otherwise see the same
         "new" form key and leave the just-saved values in the form. */
      openFormRendered.sales = null;
      renderScreen("sales");
      if(ok) toast("Sale saved — ready for the next one at the same event.");
      return;
    }
    editing.sales = null; salePreselectEvent = null; afterChange("Sale saved — inventory and dashboard updated.");
  },
  deleteSale(id){
    confirmDelete("sale", ()=>{
      state.sales = state.sales.filter(s=>s.id!==id);
      afterChange("Sale deleted — inventory restored.");
    });
  },
  /* List capping (E, P4): reveal the rest of the Sales list. The
     counter survives re-renders; exports were never capped. */
  showMoreSales(){ salesVisible = state.sales.length; renderScreen("sales"); },

  newExpense(){ go("expenses"); editing.expenses = "new"; renderScreen("expenses"); focusForm("expenses"); },
  editExpense(id){ go("expenses"); editing.expenses = id; renderScreen("expenses"); focusForm("expenses"); },
  saveExpense(){
    const amount = readNum("f-x-amount");
    if(amount <= 0){ toast("Enter an amount greater than zero."); return; }
    const rec = { date: $("f-x-date").value || todayISO(), category: $("f-x-cat").value,
      description: readStr("f-x-desc") || $("f-x-cat").value, event: $("f-x-event").value,
      amount, payment: $("f-x-pay").value };
    if(editing.expenses && editing.expenses !== "new"){
      Object.assign(state.expenses.find(x=>x.id===editing.expenses), rec);
    } else {
      state.expenses.push(Object.assign({id:uid("x")}, rec));
    }
    editing.expenses = null; afterChange("Expense saved.");
  },
  deleteExpense(id){
    confirmDelete("expense", ()=>{
      state.expenses = state.expenses.filter(x=>x.id!==id);
      afterChange("Expense deleted.");
    });
  },
  /* List capping (E, P4): reveal the rest of the Expenses list. The
     counter survives re-renders; exports were never capped. */
  showMoreExpenses(){ expensesVisible = state.expenses.length; renderScreen("expenses"); },

  /* -- calculators (live) -- */
  /* Typing in a calculator field reads the raw input into state and updates
     ONLY the output container (#pricing-out / #planner-out). The input
     elements are never rebuilt while typing, so focus, cursor position, and
     the exact text being typed all survive. Nothing is clamped, rounded,
     trimmed, or written back into an input on input — so "100" in margin,
     "2.5" expected sales, a cleared field, or a space mid-name all type
     normally. Clamping/rounding/trimming happen on blur/change (see
     pricingBlur/plannerBlur), and the localStorage write is debounced. */
  pricingChanged(){
    readPricingInputs();
    updatePricingOut();
    scheduleCalcSave();
  },
  plannerChanged(){
    readPlannerInputs();
    updatePlannerOut();
    scheduleCalcSave();
  },
  /* Blur/change: now that focus is leaving, clamp and write back ONLY where
     the displayed text no longer matches the clamped value. Empty fields
     stay empty. Then flush the debounced save. */
  pricingBlur(){
    readPricingInputs();
    clampCalcState();
    const p = state.pricing;
    syncNumInput("f-pr-mat", p.materials);
    syncNumInput("f-pr-hours", p.laborHours);
    syncNumInput("f-pr-rate", p.laborRate);
    syncNumInput("f-pr-pack", p.packaging);
    syncNumInput("f-pr-oh", p.overhead);
    syncNumInput("f-pr-margin", Math.round(p.margin*100));
    syncNumInput("f-pr-ws", Math.round(p.wholesaleDiscount*100));
    updatePricingOut();
    flushCalcSave();
  },
  plannerBlur(){
    readPlannerInputs();
    clampCalcState();
    const pl = state.planner;
    const nameEl = $("f-pl-name");
    if(nameEl && nameEl.value !== pl.eventName) nameEl.value = pl.eventName;
    syncNumInput("f-pl-booth", pl.booth);
    syncNumInput("f-pl-travel", pl.travel);
    syncNumInput("f-pl-accom", pl.accommodation);
    syncNumInput("f-pl-other", pl.other);
    syncNumInput("f-pl-exp", pl.expectedSales);
    syncNumInput("f-pl-price", pl.avgPrice);
    syncNumInput("f-pl-cost", pl.avgCost);
    syncNumInput("f-pl-hours", pl.hours);
    updatePlannerOut();
    flushCalcSave();
  },

  /* -- import / export -- */
  download(filename, content, mime){
    const blob = new Blob([content], {type: mime || "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  },
  exportJSON(){
    const payload = { app:"craft-fair-vendor-manager", formatVersion:1, exportedAt:new Date().toISOString(), data: state };
    const stamp = todayISO();
    App.download("craft-fair-backup-" + stamp + ".json", JSON.stringify(payload, null, 2));
    /* Record the successful export (backup reminder): the banner is
       driven by this date, and it clears as soon as the export lands. */
    state.lastExportAt = new Date().toISOString();
    saveState();
    if(currentScreen === "dashboard") renderScreen("dashboard");
    toast("Backup downloaded — keep the file somewhere safe.");
  },
  importJSON(){ $("fileInput").click(); },
  exportCSV(kind){
    /* CSV safety (M11): a text field starting with = + - @ would be run as
       a formula by a spreadsheet, so it is prefixed with an apostrophe
       (which the spreadsheet hides and does not treat as data). */
    const q = v => {
      let s = String(v==null?"":v);
      if(/^[=+\-@]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g,'""') + '"';
    };
    /* The \uFEFF byte-order mark + charset=utf-8 keep Excel from garbling
       non-ASCII characters such as the em dashes in product names. */
    let csv = "\uFEFF";
    if(kind === "sales"){
      csv += "Date,Event / Channel,Product,Category,Quantity,Unit price,Discount,Gross revenue,Product cost,Net profit,Payment method\n";
      [...state.sales].sort((a,b)=> cmpISO(a.date||"", b.date||"")).forEach(s=>{
        const p = productById(s.productId);
        csv += [s.date, q(eventNameOf(s.event)), q(p?p.name:""), q(p?p.category:""), s.qty, (+s.price||0).toFixed(2),
          (+s.discount||0).toFixed(2), saleGross(s).toFixed(2), saleCost(s).toFixed(2), saleProfit(s).toFixed(2), q(s.payment)].join(",") + "\n";
      });
      App.download("craft-fair-sales-" + todayISO() + ".csv", csv, "text/csv;charset=utf-8");
    } else {
      csv += "Date,Category,Description,Linked event,Amount,Payment method\n";
      [...state.expenses].sort((a,b)=> cmpISO(a.date||"", b.date||"")).forEach(x=>{
        csv += [x.date, q(x.category), q(x.description), q(eventNameOf(x.event)), (+x.amount||0).toFixed(2), q(x.payment)].join(",") + "\n";
      });
      App.download("craft-fair-expenses-" + todayISO() + ".csv", csv, "text/csv;charset=utf-8");
    }
    toast("CSV downloaded.");
  },
  clearDemo(){
    if(!window.confirm("Clear all events, products, sales, and expenses and start fresh? Export a backup first if any of this data matters — this cannot be undone.")) return;
    state = { demo:false, lowStock: (typeof state.lowStock === "number" && isFinite(state.lowStock)) ? state.lowStock : 5, events:[], products:[], sales:[], expenses:[],
      pricing: clone(DEMO_DATA.pricing), planner: clone(DEMO_DATA.planner),
      lastExportAt: state.lastExportAt || null, reminderDismissedAt: state.reminderDismissedAt || null };
    editing = { events:null, products:null, sales:null, expenses:null };
    const ok = saveState(); renderAll(); if(ok) toast("Demo data cleared — a fresh start.");
  },
  restoreDemo(){
    if(!window.confirm("Restore the demo data? This replaces everything currently in the app. Export a backup first if your own data matters.")) return;
    const prevExport = state.lastExportAt, prevDismiss = state.reminderDismissedAt;
    state = clone(DEMO_DATA);
    state.lastExportAt = prevExport || null;
    state.reminderDismissedAt = prevDismiss || null;
    editing = { events:null, products:null, sales:null, expenses:null };
    const ok = saveState(); renderAll(); if(ok) toast("Demo data restored.");
  }
};
window.App = App;

/* ---------------- Import file handling ---------------- */
$("fileInput").addEventListener("change", function(){
  const file = this.files && this.files[0];
  this.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert("The backup file is damaged or was edited.\n\nThe file could not be read as a proper backup — it may have been partly downloaded, edited by hand, or corrupted in transfer. Try downloading or sending it again. If you edited the file yourself, undo the change: even one missing bracket breaks it. Use the most recent backup you have that imports cleanly."); return; }
    if(!parsed || parsed.app !== "craft-fair-vendor-manager" || !parsed.data){
      alert("This file is not a Craft Fair Vendor Manager backup.\n\nThe file you picked is not a backup from this app — it may be a CSV, a photo, or a backup from a different app. Pick the JSON backup file (its name ends in .json). If you were trying to open a CSV, use a spreadsheet app instead: CSV files are for reading in a spreadsheet, they cannot be imported back into this app.");
      return;
    }
    if(parsed.formatVersion !== 1){
      if(typeof parsed.formatVersion === "number" && parsed.formatVersion > 1){
        alert("This backup is from a newer version and cannot be imported.\n\nThe file was made by a newer version of the app than this copy. Open it in the newer copy of the app, or export a fresh backup from there, and import that one.");
      } else {
        alert("This backup is from an older version and cannot be imported.\n\nThe file was made by an older version of the app and its layout has changed since. If you still have the old device, open the app there, export a fresh backup, and import that one. If the old device is gone, the file cannot be used — check whether you have a newer backup saved anywhere else.");
      }
      return;
    }
    const d = parsed.data;
    if(!Array.isArray(d.events) || !Array.isArray(d.products) || !Array.isArray(d.sales) || !Array.isArray(d.expenses)){
      alert("The backup file is damaged or was edited.\n\nIt is missing the lists the app needs (events, products, sales, or expenses). Try downloading or sending it again, and use the most recent backup you have that imports cleanly.");
      return;
    }
    /* One shared normalizer for load and import (M1): bad entries are
       dropped, numeric strings are coerced, missing ids are re-issued, and
       a sale's unitCost is kept exactly as it was (or left absent). */
    const norm = normalizeState(d);
    if(norm.state.events.length===0 && norm.state.products.length===0 && norm.state.sales.length===0 && norm.state.expenses.length===0){
      alert("Nothing was imported — the backup has no records.\n\nThe file is a valid backup, but it contains no events, products, sales, or expenses — it was probably exported from a fresh, empty app. Nothing was changed. Check you picked the right file.");
      return;
    }
    const summary = norm.state.events.length + " events, " + norm.state.products.length + " products, " + norm.state.sales.length + " sales, " + norm.state.expenses.length + " expenses";
    if(!window.confirm("Import this backup?\n\nIt contains " + summary + ".\n\nImporting REPLACES everything currently in the app — it does not merge. If you are unsure, cancel, export a backup of the current data first, then import.")) return;
    const prevState = state;
    state = norm.state;
    // Backups made before event links moved from names to ids are converted
    // here (first event with a matching name wins; unmatched links stay
    // unlinked rather than being dropped).
    migrateEventLinks();
    editing = { events:null, products:null, sales:null, expenses:null };
    /* saveState() never throws — it returns false (H2). If the write
       failed, nothing was persisted: put the old data back in memory too,
       so the screen still matches what is stored, and say so. */
    if(!saveState()){
      state = prevState;
      renderAll();
      alert("Import failed — browser storage is unavailable.\n\nThe app could not save after importing, usually because the browser is in private/incognito mode or storage is blocked. Close the private window and open the app in a normal browser window, then try again. Private windows forget everything when closed, so do not keep your business data in one.");
      return;
    }
    renderAll();
    let msg = "Backup imported — " + summary + ".";
    if(norm.dropped) msg += " " + norm.dropped + " damaged " + (norm.dropped===1 ? "entry was" : "entries were") + " skipped.";
    toast(msg);
  };
  reader.onerror = function(){
    alert("The backup file could not be read.\n\nTry downloading or sending it again, and use the most recent backup you have that imports cleanly.");
  };
  reader.readAsText(file);
});

/* ---------------- Multi-tab safety (M13) ----------------
   State is loaded once at startup, so without this a second tab's save
   would be silently overwritten by this tab's next save. When another tab
   writes, this tab reloads — unless a form is open or a field has focus,
   in which case it asks first so typed values are never discarded. */
function formIsOpen(){
  if(Object.keys(editing).some(k=>editing[k]!==null)) return true;
  if(salePreselectEvent) return true;
  const a = document.activeElement;
  return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"));
}
function reloadFromStorage(){
  state = loadState();
  if(migrateEventLinks()) saveState();
  /* The state object was replaced (E, P2): the memoized aggregates must
     rebuild from the new state even when nothing was migrated or saved. */
  bumpStateVersion();
  editing = { events:null, products:null, sales:null, expenses:null };
  salePreselectEvent = null;
  renderAll();
}
window.addEventListener("storage", function(e){
  if(e.key !== LS_KEY || e.newValue === null) return;
  if(!formIsOpen()){
    reloadFromStorage();
    if(loadStateCorrupt) maybeToastCorrupt(); else toast("Updated from another tab.");
    return;
  }
  if(window.confirm("Your data was changed in another tab or window.\n\nReload now to see the latest changes? If you reload, anything you have typed into the open form in this tab will be lost.")){
    reloadFromStorage();
    maybeToastCorrupt();
  }
});

/* One delegated click listener for every button that acts on a record
   (H3). Record ids travel in data-id attributes — never inside an inline
   onclick string — so a crafted id from an imported backup cannot break
   out of a handler and run code. The listener lives on document, so it
   survives every re-render. */
document.addEventListener("click", function(ev){
  const el = ev.target && ev.target.closest ? ev.target.closest("[data-action]") : null;
  if(!el) return;
  const id = el.getAttribute("data-id") || "";
  const action = el.getAttribute("data-action");
  if(action === "go"){
    const screen = el.getAttribute("data-screen") || "";
    if(SCREENS.some(s=>s.id===screen)) App.go(screen);
  }
  else if(action === "new-sale-for-event") App.newSaleForEvent(id);
  else if(action === "goto-event") App.gotoEvent(id);
  else if(action === "goto-product") App.gotoProduct(id);
  else if(action === "goto-sale") App.gotoSale(id);
  else if(action === "edit-event") App.editEvent(id);
  else if(action === "delete-event") App.deleteEvent(id);
  else if(action === "cancel-event") App.cancelEvent(id);
  else if(action === "uncancel-event") App.uncancelEvent(id);
  else if(action === "add-stock") App.addStock(id);
  else if(action === "edit-product") App.editProduct(id);
  else if(action === "delete-product") App.deleteProduct(id);
  else if(action === "edit-sale") App.editSale(id);
  else if(action === "delete-sale") App.deleteSale(id);
  else if(action === "edit-expense") App.editExpense(id);
  else if(action === "delete-expense") App.deleteExpense(id);
});

/* ---------------- Init ---------------- */
$("helpBtn").addEventListener("click", ()=>{ go("help"); });
go("dashboard");
maybeToastCorrupt();
</script>
